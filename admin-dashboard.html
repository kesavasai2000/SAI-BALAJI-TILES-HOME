<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <style>
    * { box-sizing: border-box; }
    
    /* DARK UNIVERSE BACKGROUND */
    body { 
        font-family: 'Poppins', sans-serif; 
        background-color: #000000;
        background-image: radial-gradient(circle at 50% 50%, #111111 0%, #000000 100%);
        color: #fff; 
        padding: 15px; 
        margin: 0; 
        min-height: 100vh;
    }

    /* STARS */
    .stars-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; }
    .star { position: absolute; background-color: white; border-radius: 50%; opacity: 0.8; animation: twinkle 6s infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

    .container { max-width: 1000px; margin: 0 auto; width: 100%; }
    
    .header { 
        display: flex; justify-content: space-between; align-items: center; 
        border-bottom: 1px solid rgba(255,255,255,0.1); 
        padding-bottom: 15px; flex-wrap: wrap; gap: 15px;
    }

    h1 { font-size: 22px; margin: 0; }
    
    /* TABS */
    .tabs { margin-top: 20px; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { 
        padding: 10px 15px; 
        background: rgba(255, 255, 255, 0.05); 
        color: #aaa; border: 1px solid rgba(255,255,255,0.1);
        cursor: pointer; border-radius: 5px; white-space: nowrap; transition: 0.3s;
    }
    .tab-btn.active { background: rgba(255, 255, 255, 0.15); color: white; font-weight: bold; border-color: #22d3ee; }
    
    /* GLASS CONTENT CARD */
    .section { 
        display: none; 
        background: rgba(20, 20, 20, 0.6); /* Glass Effect */
        backdrop-filter: blur(15px);
        padding: 20px; border-radius: 10px; margin-top: 20px; 
        border: 1px solid rgba(255,255,255,0.1);
    }
    .section.active { display: block; }

    /* TABLES */
    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 600px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { color: #22d3ee; }

    /* FORMS */
    .input-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }

    input { 
        padding: 12px; 
        background: rgba(0, 0, 0, 0.5); 
        border: 1px solid rgba(255,255,255,0.2); 
        color: white; border-radius: 4px; 
        flex: 1; min-width: 200px;
    }
    input::placeholder { color: #777; }

    .btn-add { 
        background: rgba(6, 182, 212, 0.1); color: #22d3ee; 
        border: 1px solid #22d3ee; padding: 12px 20px; 
        cursor: pointer; flex-grow: 1; transition: 0.3s;
    }
    .btn-add:hover { background: #22d3ee; color: #000; }
    
    .status-delivered { color: #4cc9f0; font-weight: bold; }
    .status-processing { color: #f72585; font-weight: bold; }

    @media (max-width: 600px) {
        .section { padding: 15px; }
        .input-group { flex-direction: column; }
        input { width: 100%; }
    }
    /* FORCE HEADER TO BE PERMANENTLY TRANSPARENT ON ALL PAGES */
#main-header, header {
    background-color: transparent !important;
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
}

/* PREVENT HEADER.JS FROM PUSHING THE BACKGROUND DOWN */
body {
    background-position: top center !important;
}
</style>
</head>
<body>
    <!-- Background Stars Container -->
<div class="stars-container" id="stars-bg-global"></div>

    <div class="container">
        <div class="header">
            <h1>👑 Admin Dashboard</h1>
            <button onclick="logout()" style="background: #e94560; color: white; border: none; padding: 8px 16px; cursor:pointer;">Logout</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('orders')">📦 All Orders</button>
            <button class="tab-btn" onclick="showTab('inventory')">🏭 Inventory Management</button>
        </div>

        <!-- SECTION 1: ALL ORDERS -->
<div id="orders" class="section active">
    <h2>Sales History</h2>
    
    <!-- 👇 YOU NEED TO ADD THIS WRAPPER 👇 -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Worker</th>
                    <th>Item</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="orders-table-body">
                <!-- Rows will be added here by JS -->
            </tbody>
        </table>
    </div> <!-- 👆 CLOSE THE WRAPPER HERE 👆 -->

</div>

        <!-- Inside Inventory Section -->
        <h2>Add New Product</h2>
        <div class="input-group"> <!-- Add this class -->
            <input type="text" id="prodName" placeholder="Tile Name">
            <input type="text" id="prodBrand" placeholder="Brand">
            <input type="number" id="prodStock" placeholder="Stock">
            <button class="btn-add" onclick="addProduct()">+ Add Product</button>
        </div>
        

            <h2>Current Stock</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Brand</th>
                        <th>Stock (Boxes)</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                    <!-- Rows will be added here by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // BACKEND CONFIG
        // ==========================================
        const API_URL = 'http://localhost:5000';

        // JWT Auth Helper — reads token from localStorage and builds the header
        // WHY a helper? Every fetch() to a protected route needs this header.
        // Instead of typing it 10 times, we call getAuthHeaders() once.
        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        // --- AUTH CHECK ---
        // WHY check role here?
        // Admin dashboard should ONLY be accessible to admin users.
        // If someone manually types the URL, we verify their role from the token.
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token) { window.location.href = 'auth.html'; return; }
            if (user.role !== 'admin') {
                alert('Access denied. Admins only.');
                window.location.href = 'index.html';
            }
        }
        checkAuth();

        // --- LOAD DATA ---
        // WHY fetch from our own server now?
        // Previously this called Supabase directly from the browser.
        // Now the browser asks OUR server, which asks PostgreSQL.
        // This keeps DB credentials on the server — never exposed to the browser.
        async function loadData() {
            // 1. Get All Orders from our backend
            try {
                const res = await fetch(`${API_URL}/orders`, { headers: getAuthHeaders() });
                const orders = await res.json();
                const orderTable = document.getElementById('orders-table-body');
                orderTable.innerHTML = '';
                if(Array.isArray(orders)) {
                    orders.forEach(o => {
                        const date = new Date(o.created_at).toLocaleDateString();
                        const statusClass = o.status === 'delivered' ? 'status-delivered' : 'status-processing';
                        const item = Array.isArray(o.items) ? o.items[0] : {};
                        orderTable.innerHTML += `<tr>
                            <td>${date}</td>
                            <td>${o.customer_name}</td>
                            <td>Worker ID: ${String(o.worker_id).slice(0,5)}...</td>
                            <td>${item.tile || '-'} (${item.qty || '-'})</td>
                            <td class="${statusClass}">${o.status.toUpperCase()}</td>
                        </tr>`;
                    });
                }
            } catch(e) { console.error('Orders load failed:', e); }

            // 2. Get All Products from our backend
            try {
                const res = await fetch(`${API_URL}/products`, { headers: getAuthHeaders() });
                const products = await res.json();
                const prodTable = document.getElementById('products-table-body');
                prodTable.innerHTML = '';
                if(Array.isArray(products)) {
                    products.forEach(p => {
                        prodTable.innerHTML += `<tr>
                            <td>${p.name}</td>
                            <td>${p.brand}</td>
                            <td>${p.stock}</td>
                        </tr>`;
                    });
                }
            } catch(e) { console.error('Products load failed:', e); }
        }

        // --- ADD PRODUCT ---
        // WHY POST /products?
        // We'll add this route to server.js next. It inserts a product into
        // PostgreSQL and requires the admin JWT token to be authorised.
        async function addProduct() {
            const name = document.getElementById('prodName').value;
            const brand = document.getElementById('prodBrand').value;
            const stock = document.getElementById('prodStock').value;
            if(!name || !stock) return alert("Fill details");
            try {
                const res = await fetch(`${API_URL}/products`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ name, brand, stock })
                });
                const data = await res.json();
                if(!res.ok) throw new Error(data.message);
                alert("Product Added!");
                document.getElementById('prodName').value = '';
                document.getElementById('prodStock').value = '';
                loadData();
            } catch(e) { alert("Error: " + e.message); }
        }

        // --- UI FUNCTIONS ---
        function showTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function logout() {
            // WHY just remove from localStorage?
            // JWT is stateless — there's no "session" on the server to destroy.
            // Removing the token locally is enough to log the user out.
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'auth.html';
        }

        // Load data on startup
        loadData();
    </script>
</body>
</html>
