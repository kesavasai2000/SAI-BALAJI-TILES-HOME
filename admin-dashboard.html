<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
    /* BASE SETTINGS & DARK THEME */
    * { box-sizing: border-box; }
    body { 
        font-family: 'Poppins', sans-serif; 
        background: linear-gradient(270deg, #0d0320, #1a094b, #000000, #8e2de2, #000000);
        background-size: 300% 300%;
        animation: gradientBG 20s ease infinite;
        color: #fff; 
        padding: 15px; 
        margin: 0; 
        min-height: 100vh;
    }

    @keyframes gradientBG { 
        0% { background-position: 0% 50%; } 
        50% { background-position: 100% 50%; } 
        100% { background-position: 0% 50%; } 
    }

    /* STARS BACKGROUND */
    .stars-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; }
    .star { position: absolute; background-color: rgba(255, 255, 255, 0.8); border-radius: 50%; animation: twinkle 6s infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.2); } }

    /* LAYOUT */
    .container { max-width: 1000px; margin: 0 auto; width: 100%; }
    
    .header { 
        display: flex; justify-content: space-between; align-items: center; 
        border-bottom: 1px solid rgba(255,255,255,0.2); 
        padding-bottom: 15px; flex-wrap: wrap; gap: 15px;
    }

    h1 { font-size: 22px; margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    
    /* TABS */
    .tabs { margin-top: 20px; display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { 
        padding: 10px 15px; 
        background: rgba(255, 255, 255, 0.1); 
        color: #ccc; border: 1px solid rgba(255,255,255,0.1);
        cursor: pointer; border-radius: 5px; white-space: nowrap; 
        transition: 0.3s;
    }
    .tab-btn.active { background: #e94560; color: white; font-weight: bold; border-color: #e94560; }
    
    /* CONTENT CARD */
    .section { 
        display: none; 
        background: rgba(22, 33, 62, 0.8); /* Semi-transparent dark blue */
        backdrop-filter: blur(10px);
        padding: 20px; border-radius: 10px; margin-top: 20px; 
        border: 1px solid rgba(255,255,255,0.1);
    }
    .section.active { display: block; }

    /* RESPONSIVE TABLES */
    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 600px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    th { color: #e94560; }

    /* FORMS */
    .input-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }

    input { 
        padding: 12px; 
        background: rgba(0, 0, 0, 0.4); 
        border: 1px solid rgba(255,255,255,0.2); 
        color: white; border-radius: 4px; 
        flex: 1; min-width: 200px;
    }
    input::placeholder { color: #aaa; }

    .btn-add { 
        background: rgba(76, 201, 240, 0.2); color: #4cc9f0; 
        border: 1px solid #4cc9f0; padding: 12px 20px; 
        cursor: pointer; flex-grow: 1; transition: 0.3s;
    }
    .btn-add:hover { background: #4cc9f0; color: #000; }
    
    .status-delivered { color: #4cc9f0; font-weight: bold; }
    .status-processing { color: #e94560; font-weight: bold; }

    @media (max-width: 600px) {
        .section { padding: 15px; }
        .input-group { flex-direction: column; }
        input { width: 100%; }
    }
</style>
</head>
<body>
    <!-- Background Stars Container -->
<div class="stars-container" id="stars-bg-global"></div>

    <div class="container">
        <div class="header">
            <h1>👑 Admin Dashboard</h1>
            <button onclick="logout()" style="background: #e94560; color: white; border: none; padding: 8px 16px; cursor:pointer;">Logout</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('orders')">📦 All Orders</button>
            <button class="tab-btn" onclick="showTab('inventory')">🏭 Inventory Management</button>
        </div>

        <!-- SECTION 1: ALL ORDERS -->
<div id="orders" class="section active">
    <h2>Sales History</h2>
    
    <!-- 👇 YOU NEED TO ADD THIS WRAPPER 👇 -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Customer</th>
                    <th>Worker</th>
                    <th>Item</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="orders-table-body">
                <!-- Rows will be added here by JS -->
            </tbody>
        </table>
    </div> <!-- 👆 CLOSE THE WRAPPER HERE 👆 -->

</div>

        <!-- Inside Inventory Section -->
        <h2>Add New Product</h2>
        <div class="input-group"> <!-- Add this class -->
            <input type="text" id="prodName" placeholder="Tile Name">
            <input type="text" id="prodBrand" placeholder="Brand">
            <input type="number" id="prodStock" placeholder="Stock">
            <button class="btn-add" onclick="addProduct()">+ Add Product</button>
        </div>
        

            <h2>Current Stock</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Brand</th>
                        <th>Stock (Boxes)</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                    <!-- Rows will be added here by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚀 PASTE YOUR KEYS HERE
        // ==========================================
        const supabaseUrl = 'https://jjseffkbreruegudlmnd.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impqc2VmZmticmVydWVndWRsbW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxOTMwMTEsImV4cCI6MjA4MTc2OTAxMX0.xrCWARm6FbW-U98Qs13mMvlCeBiQWgmD73qverF7Brk';

        const sbClient = supabase.createClient(supabaseUrl, supabaseKey);

        // --- AUTH CHECK ---
        async function checkAuth() {
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) window.location.href = 'auth.html';
        }
        checkAuth();

        // --- LOAD DATA ---
        async function loadData() {
            // 1. Get All Orders
            const { data: orders } = await sbClient
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            const orderTable = document.getElementById('orders-table-body');
            orderTable.innerHTML = '';
            
            if(orders) {
                orders.forEach(o => {
                    const date = new Date(o.created_at).toLocaleDateString();
                    const statusClass = o.status === 'delivered' ? 'status-delivered' : 'status-processing';
                    
                    const row = `<tr>
                        <td>${date}</td>
                        <td>${o.customer_name}</td>
                        <td>Worker ID: ${o.worker_id.slice(0,5)}...</td>
                        <td>${o.items[0].tile} (${o.items[0].qty})</td>
                        <td class="${statusClass}">${o.status.toUpperCase()}</td>
                    </tr>`;
                    orderTable.innerHTML += row;
                });
            }

            // 2. Get All Products
            const { data: products } = await sbClient.from('products').select('*');
            const prodTable = document.getElementById('products-table-body');
            prodTable.innerHTML = '';

            if(products) {
                products.forEach(p => {
                    const row = `<tr>
                        <td>${p.name}</td>
                        <td>${p.brand}</td>
                        <td>${p.stock}</td>
                    </tr>`;
                    prodTable.innerHTML += row;
                });
            }
        }

        // --- ADD PRODUCT ---
        async function addProduct() {
            const name = document.getElementById('prodName').value;
            const brand = document.getElementById('prodBrand').value;
            const stock = document.getElementById('prodStock').value;

            if(!name || !stock) return alert("Fill details");

            const { error } = await sbClient
                .from('products')
                .insert([{ name, brand, stock }]);

            if(error) {
                alert("Error: " + error.message);
            } else {
                alert("Product Added!");
                document.getElementById('prodName').value = '';
                document.getElementById('prodStock').value = '';
                loadData(); // Refresh list
            }
        }

        // --- UI FUNCTIONS ---
        function showTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function logout() {
            await sbClient.auth.signOut();
            window.location.href = 'auth.html';
        }

        // Load data on startup
        loadData();
    </script>
</body>
</html>
