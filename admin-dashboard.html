<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #1a1a2e; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; }
        
        /* TABS */
        .tabs { margin-top: 20px; display: flex; gap: 10px; }
        .tab-btn { padding: 10px 20px; background: #16213e; color: #ccc; border: none; cursor: pointer; border-radius: 5px; }
        .tab-btn.active { background: #e94560; color: white; font-weight: bold; }
        
        /* CONTENT */
        .section { display: none; background: #16213e; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .section.active { display: block; }

        /* TABLES */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        th { color: #e94560; }

        /* FORMS */
        input { padding: 10px; margin-right: 10px; background: #0f3460; border: 1px solid #333; color: white; border-radius: 4px; }
        .btn-add { background: #0f3460; color: #4cc9f0; border: 1px solid #4cc9f0; padding: 10px 20px; cursor: pointer; }
        .btn-add:hover { background: #4cc9f0; color: black; }
        .status-delivered { color: #4cc9f0; font-weight: bold; }
        .status-processing { color: #e94560; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>👑 Admin Dashboard</h1>
            <button onclick="logout()" style="background: #e94560; color: white; border: none; padding: 8px 16px; cursor:pointer;">Logout</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('orders')">📦 All Orders</button>
            <button class="tab-btn" onclick="showTab('inventory')">🏭 Inventory Management</button>
        </div>

        <!-- SECTION 1: ALL ORDERS -->
        <div id="orders" class="section active">
            <h2>Sales History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Worker</th>
                        <th>Item</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <!-- Rows will be added here by JS -->
                </tbody>
            </table>
        </div>

        <!-- SECTION 2: INVENTORY -->
        <div id="inventory" class="section">
            <h2>Add New Product</h2>
            <div style="margin-bottom: 30px;">
                <input type="text" id="prodName" placeholder="Tile Name (e.g. Onyx Marble)">
                <input type="text" id="prodBrand" placeholder="Brand (e.g. Kajaria)">
                <input type="number" id="prodStock" placeholder="Stock (Boxes)">
                <button class="btn-add" onclick="addProduct()">+ Add Product</button>
            </div>

            <h2>Current Stock</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Brand</th>
                        <th>Stock (Boxes)</th>
                    </tr>
                </thead>
                <tbody id="products-table-body">
                    <!-- Rows will be added here by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚀 PASTE YOUR KEYS HERE
        // ==========================================
        const supabaseUrl = 'https://jjseffkbreruegudlmnd.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impqc2VmZmticmVydWVndWRsbW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxOTMwMTEsImV4cCI6MjA4MTc2OTAxMX0.xrCWARm6FbW-U98Qs13mMvlCeBiQWgmD73qverF7Brk';

        const sbClient = supabase.createClient(supabaseUrl, supabaseKey);

        // --- AUTH CHECK ---
        async function checkAuth() {
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) window.location.href = 'auth.html';
        }
        checkAuth();

        // --- LOAD DATA ---
        async function loadData() {
            // 1. Get All Orders
            const { data: orders } = await sbClient
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            const orderTable = document.getElementById('orders-table-body');
            orderTable.innerHTML = '';
            
            if(orders) {
                orders.forEach(o => {
                    const date = new Date(o.created_at).toLocaleDateString();
                    const statusClass = o.status === 'delivered' ? 'status-delivered' : 'status-processing';
                    
                    const row = `<tr>
                        <td>${date}</td>
                        <td>${o.customer_name}</td>
                        <td>Worker ID: ${o.worker_id.slice(0,5)}...</td>
                        <td>${o.items[0].tile} (${o.items[0].qty})</td>
                        <td class="${statusClass}">${o.status.toUpperCase()}</td>
                    </tr>`;
                    orderTable.innerHTML += row;
                });
            }

            // 2. Get All Products
            const { data: products } = await sbClient.from('products').select('*');
            const prodTable = document.getElementById('products-table-body');
            prodTable.innerHTML = '';

            if(products) {
                products.forEach(p => {
                    const row = `<tr>
                        <td>${p.name}</td>
                        <td>${p.brand}</td>
                        <td>${p.stock}</td>
                    </tr>`;
                    prodTable.innerHTML += row;
                });
            }
        }

        // --- ADD PRODUCT ---
        async function addProduct() {
            const name = document.getElementById('prodName').value;
            const brand = document.getElementById('prodBrand').value;
            const stock = document.getElementById('prodStock').value;

            if(!name || !stock) return alert("Fill details");

            const { error } = await sbClient
                .from('products')
                .insert([{ name, brand, stock }]);

            if(error) {
                alert("Error: " + error.message);
            } else {
                alert("Product Added!");
                document.getElementById('prodName').value = '';
                document.getElementById('prodStock').value = '';
                loadData(); // Refresh list
            }
        }

        // --- UI FUNCTIONS ---
        function showTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function logout() {
            await sbClient.auth.signOut();
            window.location.href = 'auth.html';
        }

        // Load data on startup
        loadData();
    </script>
</body>
</html>
