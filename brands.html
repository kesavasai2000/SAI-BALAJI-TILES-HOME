<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sai Balaji Tiles - Brand Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
       body { 
        background-color: #000000;
        /* Deep Space Radial Gradient */
        background-image: radial-gradient(circle at 50% 50%, #111111 0%, #000000 100%);
        overflow-x: hidden; 
        color: #e2e8f0; /* Soft White Text */
    }
        @keyframes gradientBG { 
            0% { background-position: 0% 50%; } 
            50% { background-position: 100% 50%; } 
            100% { background-position: 0% 50%; } 
        }

        .stars-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: hidden; z-index: 0; }
        .star { position: absolute; background-color: rgba(255, 255, 255, 0.7); border-radius: 50%; animation: twinkle 6s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.1; transform: scale(0.6); } 50% { opacity: 0.7; transform: scale(1); } }

        .brand-card {
            background: rgba(17, 24, 39, 0.8);
            border: 2px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .brand-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.1), rgba(139, 92, 246, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .brand-card:hover::before {
            opacity: 1;
        }

        .brand-card:hover {
            transform: translateY(-8px);
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 20px 40px rgba(34, 211, 238, 0.2);
        }

        .brand-logo-container {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .brand-logo {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: grayscale(20%);
            transition: all 0.3s ease;
        }

        .brand-card:hover .brand-logo {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .btn-theme-primary {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            border: 2px solid rgba(6,182,212,0.9);
            color: rgba(34,211,238,0.95);
            background: rgba(31,41,55,0.6);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-theme-primary:hover {
            box-shadow: 0 0 15px rgba(34,211,238,0.4), 0 0 25px rgba(34,211,238,0.2);
            transform: translateY(-2px) scale(1.02);
        }

        .brand-info {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .tile-count-badge {
            display: inline-block;
            background: rgba(34, 211, 238, 0.2);
            color: #22d3ee;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars-bg-global"></div>

    <div id="stars-bg-global" class="stars-container"></div>
  <header id="main-header" class="fixed w-full top-0 left-0 bg-transparent transition-all duration-300 flex items-center justify-between px-4 sm:px-6 py-5 z-50">
            <div class="flex-none">
                <button id="toggle-btn-index" aria-label="Toggle menu" class="text-2xl text-cyan-400 hover:text-cyan-300 transition-colors focus:outline-none">☰</button>
            </div>
        <div class="flex-none">
            <a href="cart.html" class="text-cyan-400 hover:text-cyan-300">
                🛒 <span id="cart-count">0</span>
            </a>
        </div>
    </header>

    <nav id="main-navbar" class="navbar fixed top-0 left-0 w-72 h-screen bg-gray-900/80 backdrop-blur-md shadow-lg transform -translate-x-full transition-transform duration-300 z-30 border-r border-cyan-500/30">
        <ul class="nav-menu mt-20 space-y-4 p-4">
            <li><a href="index.html#home" class="block py-2 text-indigo-300 hover:text-indigo-200">Home</a></li>
            <li><a href="#brands" class="block py-2 text-indigo-300 hover:text-indigo-200">Brands</a></li>
            <li><a href="index.html#about" class="block py-2 text-indigo-300 hover:text-indigo-200">About</a></li>
            <li><a href="index.html#contact" class="block py-2 text-indigo-300 hover:text-indigo-200">Contact</a></li>
            <li><a href="cart.html" class="block py-2 text-indigo-300 hover:text-indigo-200">Cart (<span id="cart-count-nav">0</span>)</a></li>
        </ul>
    </nav>

    <main style="padding-top: 5rem; position: relative; z-index: 1;">
        <section id="brands" class="py-16 min-h-screen">
            <div class="container mx-auto px-4">
                <h2 class="text-4xl font-bold text-center mb-4 text-cyan-400">Explore Our Premium Brands</h2>
                <p class="text-center text-gray-300 mb-12 max-w-2xl mx-auto">
                    We partner with India's leading tile manufacturers to bring you the finest quality and designs
                </p>

                <div id="brands-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Brands will be populated here by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-400 text-center py-6 border-t border-cyan-500/30 relative z-10">
        <p>© 2025 Sai Balaji Tiles. All Rights Reserved.</p>
    </footer>

    <script>
        // ==================== BRAND DATA ====================
        const brandsData = [
            {
                id: 'kajaria',
                name: 'KAJARIA',
                logo: 'images/brands/kar.png', // Add your logo images
                tileCount: 150,
                description: 'India\'s largest tile manufacturer with premium designs',
                redirectUrl: 'brand-tiles.html?brand=kajaria'
            },
            {
                id: 'qtone',
                name: 'QUTONE',
                logo: 'images/brands/brand2.png',
                tileCount: 120,
                description: 'Luxury vitrified tiles with cutting-edge technology',
                redirectUrl: 'brand-tiles.html?brand=qtone'
            },
            {
                id: 'somany',
                name: 'SOMANY',
                logo: 'images/brands/Somany-logo.png',
                tileCount: 180,
                description: 'Trusted name in ceramic and vitrified tiles',
                redirectUrl: 'brand-tiles.html?brand=somany'
            },
            {
                id: 'itaca',
                name: 'ITACA',
                logo: 'images/brands/nitco-logo.png',
                tileCount: 130,
                description: 'Innovative tile solutions for modern living spaces',
                redirectUrl: 'brand-tiles.html?brand=nitco'
            },
            {
                id: 'colortile',
                name: 'COLORTILE',
                logo: 'images/brands/orient-bell-logo.png',
                tileCount: 160,
                description: 'A blend of aesthetics and durability in every tile',
                redirectUrl: 'brand-tiles.html?brand=orientbell'
            }
            
            
        ];

        // ==================== POPULATE BRANDS ====================
        function populateBrands() {
            const brandsGrid = document.getElementById('brands-grid');
            brandsGrid.innerHTML = '';

            brandsData.forEach(brand => {
                const brandCard = document.createElement('div');
                brandCard.className = 'brand-card';
                brandCard.onclick = () => window.location.href = brand.redirectUrl;

                brandCard.innerHTML = `
                    <div class="brand-logo-container">
                        <img src="${brand.logo}" alt="${brand.name} Logo" class="brand-logo" 
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22100%22%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2224%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%2322d3ee%22%3E${brand.name}%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="brand-info">
                        <h3 class="text-2xl font-bold text-indigo-300 mb-2">${brand.name}</h3>
                        <p class="text-gray-400 text-sm mb-3">${brand.description}</p>
                        <div class="tile-count-badge">
                            ${brand.tileCount}+ Designs
                        </div>
                        <div class="mt-4">
                            <span class="btn-theme-primary">View Collection →</span>
                        </div>
                    </div>
                `;

                brandsGrid.appendChild(brandCard);
            });
        }

        // ==================== STARS ANIMATION ====================
        function createStars() {
            const container = document.getElementById('stars-bg-global');
            container.innerHTML = '';
            const numStars = Math.min(200, Math.floor(window.innerWidth / 18));
            
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 4}s`;
                container.appendChild(star);
            }
        }

        // ==================== NAVBAR TOGGLE ====================
        const toggleBtn = document.getElementById('toggle-btn');
        const navbar = document.getElementById('main-navbar');
        let menuVisible = false;

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuVisible = !menuVisible;
            navbar.classList.toggle('translate-x-0', menuVisible);
            navbar.classList.toggle('-translate-x-full', !menuVisible);
        });

        document.addEventListener('click', (e) => {
            if (menuVisible && !navbar.contains(e.target) && e.target !== toggleBtn) {
                menuVisible = false;
                navbar.classList.add('-translate-x-full');
                navbar.classList.remove('translate-x-0');
            }
        });

        // ==================== CART COUNT ====================
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.length;
            document.getElementById('cart-count').textContent = count;
            document.getElementById('cart-count-nav').textContent = count;
        }

        // ==================== INITIALIZE ====================
        window.addEventListener('load', () => {
            createStars();
            populateBrands();
            updateCartCount();
        });

        window.addEventListener('resize', createStars);
        window.addEventListener('storage', (e) => {
            if (e.key === 'cart') updateCartCount();
        });
    </script>
</body>
</html>
