<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sai Balaji Tiles - Brand Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        /* 1. DARK UNIVERSE BACKGROUND */
        body { 
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 50%, #111111 0%, #000000 100%);
            overflow-x: hidden; 
            color: #e2e8f0; 
        }

        /* 2. STARS */
        .stars-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; }
        .star { position: absolute; background-color: rgba(255, 255, 255, 0.8); border-radius: 50%; animation: twinkle 6s infinite ease-in-out; }
        @keyframes twinkle { 0%, 100% { opacity: 0.1; transform: scale(0.6); } 50% { opacity: 1; transform: scale(1.2); } }

        /* 3. TRANSPARENT HEADER */
        #main-header, header {
            background-color: transparent !important;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-bottom: none !important;
            box-shadow: none !important;
        }

        /* 4. GLASS BRAND CARDS */
        .brand-card {
            background: rgba(20, 20, 20, 0.6); /* Dark Glass */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .brand-card:hover {
            transform: translateY(-8px);
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 15px 40px rgba(34, 211, 238, 0.2);
        }

        .brand-logo-container {
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.95); /* Keep white so logos are visible */
            border-radius: 12px;
            margin-bottom: 1.5rem;
            padding: 1rem;
        }

        .brand-logo {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }
        .brand-card:hover .brand-logo {
            transform: scale(1.05);
        }

        /* 5. BUTTONS & BADGES */
        .btn-theme-primary {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            background: linear-gradient(to right, #06b6d4, #3b82f6);
            color: white;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .brand-card:hover .btn-theme-primary {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }

        .tile-count-badge {
            display: inline-block;
            background: rgba(34, 211, 238, 0.15);
            color: #22d3ee;
            border: 1px solid rgba(34, 211, 238, 0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars-bg-global"></div>

    <header id="main-header" class="fixed w-full top-0 left-0 flex items-center justify-between p-4 z-50">
        <div class="flex-none">
            <button id="toggle-btn" aria-label="Toggle menu" class="text-3xl text-cyan-400 hover:text-cyan-300">☰</button>
        </div>
        
        

        <div class="flex-none">
            <a href="cart.html" class="text-cyan-400 hover:text-cyan-300 text-xl relative">
                🛒 <span id="cart-count" class="text-xs font-bold absolute -top-2 -right-2 bg-red-500 text-white rounded-full px-1.5 py-0.5">0</span>
            </a>
        </div>
    </header>

    <!-- SIDEBAR -->
    <nav id="main-navbar-index" class="navbar fixed top-0 left-0 w-64 h-screen bg-gray-900 shadow-2xl transform -translate-x-full transition-transform duration-300 z-40 border-r border-gray-700">
        <ul class="nav-menu mt-20 space-y-4 p-5">
            <li><a href="index.html#home" class="block text-gray-300 hover:text-cyan-400 text-lg">Home</a></li>
            <li><a href="#brands" class="block text-gray-300 hover:text-cyan-400 text-lg">Brands</a></li>
            <li><a href="index.html#about" class="block text-gray-300 hover:text-cyan-400 text-lg">About</a></li>
            <li><a href="index.html#contact" class="block text-gray-300 hover:text-cyan-400 text-lg">Contact</a></li>
            <li><a href="cart.html" class="block text-gray-300 hover:text-cyan-400 text-lg">Cart (<span id="cart-count-nav">0</span>)</a></li>
        </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <main style="padding-top: 6rem; position: relative; z-index: 1;">
        <section id="brands" class="py-10 min-h-screen">
            <div class="container mx-auto px-4">
                <h2 class="text-4xl font-bold text-center mb-4 text-cyan-400">Explore Our Premium Brands</h2>
                <p class="text-center text-gray-400 mb-12 max-w-2xl mx-auto">
                    We partner with India's leading tile manufacturers to bring you the finest quality and designs.
                </p>

                <div id="brands-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
                    <!-- Brands will be populated here by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer class="text-gray-500 text-center py-6 border-t border-gray-800 mt-10 relative z-10 text-sm">
        <p>© 2025 Sai Balaji Tiles. All Rights Reserved.</p>
    </footer>

    <script>
        // ==================== BRAND DATA ====================
        const brandsData = [
            {
                id: 'kajaria',
                name: 'KAJARIA',
                logo: 'images/brands/kar.png',
                tileCount: 150,
                description: 'India\'s largest tile manufacturer with premium designs',
                redirectUrl: 'brand-tiles.html?brand=kajaria'
            },
            {
                id: 'qtone',
                name: 'QUTONE',
                logo: 'images/brands/qtone-logo.png',
                tileCount: 120,
                description: 'Luxury vitrified tiles with cutting-edge technology',
                redirectUrl: 'brand-tiles.html?brand=qtone'
            },
            {
                id: 'somany',
                name: 'SOMANY',
                logo: 'images/brands/Somany-logo.png',
                tileCount: 180,
                description: 'Trusted name in ceramic and vitrified tiles',
                redirectUrl: 'brand-tiles.html?brand=somany'
            },
            {
                id: 'itaca',
                name: 'ITACA',
                logo: 'images/brands/johnson-logo.png',
                tileCount: 130,
                description: 'Innovative tile solutions for modern living spaces',
                redirectUrl: 'brand-tiles.html?brand=nitco'
            },
            {
                id: 'colortile',
                name: 'COLORTILE',
                logo: 'images/brands/orient-bell-logo.png',
                tileCount: 160,
                description: 'A blend of aesthetics and durability in every tile',
                redirectUrl: 'brand-tiles.html?brand=orientbell'
            }
        ];

        // ==================== POPULATE BRANDS ====================
        function populateBrands() {
            const brandsGrid = document.getElementById('brands-grid');
            brandsGrid.innerHTML = '';

            brandsData.forEach(brand => {
                const brandCard = document.createElement('div');
                brandCard.className = 'brand-card';
                brandCard.onclick = () => window.location.href = brand.redirectUrl;

                brandCard.innerHTML = `
                    <div class="brand-logo-container">
                        <img src="${brand.logo}" alt="${brand.name} Logo" class="brand-logo" 
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22100%22%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2224%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%2322d3ee%22%3E${brand.name}%3C/text%3E%3C/svg%3E'">
                    </div>
                    <h3 class="text-2xl font-bold text-white mb-2">${brand.name}</h3>
                    <p class="text-gray-400 text-sm mb-3 px-2">${brand.description}</p>
                    <div class="tile-count-badge">${brand.tileCount}+ Designs</div>
                    <span class="btn-theme-primary">View Collection →</span>
                `;

                brandsGrid.appendChild(brandCard);
            });
        }

        // ==================== STARS ANIMATION ====================
        function createStars() {
            const container = document.getElementById('stars-bg-global');
            if (!container) return;
            container.innerHTML = '';
            const numStars = Math.min(100, Math.floor(window.innerWidth / 20));
            
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.animationDuration = `${Math.random() * 3 + 4}s`;
                container.appendChild(star);
            }
        }

        // ==================== NAVBAR TOGGLE (FIXED) ====================
        const toggleBtn = document.getElementById('toggle-btn');
        const navbar = document.getElementById('main-navbar-index'); // Fixed ID
        let menuVisible = false;

        if (toggleBtn && navbar) {
            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                menuVisible = !menuVisible;
                navbar.classList.toggle('translate-x-0', menuVisible);
                navbar.classList.toggle('-translate-x-full', !menuVisible);
            });

            document.addEventListener('click', (e) => {
                if (menuVisible && !navbar.contains(e.target) && e.target !== toggleBtn) {
                    menuVisible = false;
                    navbar.classList.add('-translate-x-full');
                    navbar.classList.remove('translate-x-0');
                }
            });
        }

        // ==================== CART COUNT ====================
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.length;
            const headerCount = document.getElementById('cart-count');
            const navCount = document.getElementById('cart-count-nav');
            
            if(headerCount) headerCount.textContent = count;
            if(navCount) navCount.textContent = count;
        }

        // ==================== INITIALIZE (FIXED TIMING) ====================
        // Using DOMContentLoaded ensures it renders instantly even if images are slow
        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            populateBrands();
            updateCartCount();
        });

        window.addEventListener('resize', createStars);
        window.addEventListener('storage', (e) => {
            if (e.key === 'cart') updateCartCount();
        });
    </script>
</body>
</html>
