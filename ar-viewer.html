<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Tile Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; }
    .ar-container { display: none; }
    .ios-fallback { display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; height: 100vh; background-color: #111; color: white; padding: 20px; }
    .ios-fallback img { width: 150px; height: 150px; border-radius: 8px; margin-bottom: 24px; object-fit: cover; }
    .ios-fallback a { padding: 12px 24px; font-size: 18px; background-color: #007aff; color: white; text-decoration: none; border-radius: 8px; }
    #instructions { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 8px; z-index: 10; text-align: center; }
  </style>

  <script>
  /* Tile-grid component: keeps grid generation logic inside a component so we simply set modelSrc later */
  AFRAME.registerComponent('tile-grid', {
    schema: {
      gridSize: {type: 'number', default: 15},
      tileWidth: {type: 'number', default: 0.3},
      tileHeight: {type: 'number', default: 0.3},
      modelSrc: {type: 'string', default: ''}
    },

    update: function (oldData) {
      const data = this.data;
      const el = this.el;

      // only run if a new modelSrc was provided
      if (!data.modelSrc || data.modelSrc === oldData.modelSrc) {
        return;
      }

      // Remove previous tiles
      while (el.firstChild) {
        el.removeChild(el.firstChild);
      }

      const half = data.gridSize / 2;
      // create tiles on X (left-right) and Z (forward-back) plane,
      // keeping Y at 0 (so the grid sits on the floor plane).
      for (let i = 0; i < data.gridSize; i++) {
        for (let j = 0; j < data.gridSize; j++) {
          const tile = document.createElement('a-entity');
          tile.setAttribute('gltf-model', data.modelSrc);
          // place on X and Z axis, Y=0
          const x = (i - half) * data.tileWidth;
          const z = (j - half) * data.tileHeight;
          tile.setAttribute('position', { x: x, y: 0, z: z });
          // optional: small rotation or scale if needed:
          // tile.setAttribute('rotation', {x: -90, y: 0, z: 0});
          el.appendChild(tile);
        }
      }
    }
  });
  </script>
</head>
<body>

  <div id="android-ar-container" class="ar-container">
      <div id="instructions">Scanning for a surface... Move your phone slowly and tap to place the tiles.</div>
      <a-scene 
          id="ar-scene"
          webxr="requiredFeatures: hit-test, local-floor;"
          ar-hit-test="target: #tile-grid-container; type: feature-point;"
          renderer="colorManagement: true;">
        <a-camera position="0 1.2 0"></a-camera>
        <a-entity id="tile-grid-container" visible="false"></a-entity>
      </a-scene>
  </div>

  <div id="ios-fallback-container" class="ios-fallback">
      <img id="ios-thumbnail" src="images/tiles1.jpg" alt="Tile Preview"/>
      <p style="margin-bottom: 24px;">Ready to see this tile in your room?</p>
      <a id="ios-link" rel="ar" href="#">View in Room</a>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const rawGlbParam = urlParams.get('model');
    const rawUsdzParam = urlParams.get('iosmodel');

    if (!rawGlbParam || !rawUsdzParam) {
      document.body.innerHTML = '<h1 style="color:#fff;background:#000;padding:40px;text-align:center;">Error: model not specified in URL</h1>';
      return;
    }

    // decode values (they were encoded in tile-detail)
    let glbPath = rawGlbParam;
    let usdzPath = rawUsdzParam;
    try {
      glbPath = decodeURIComponent(rawGlbParam);
      usdzPath = decodeURIComponent(rawUsdzParam);
    } catch (e) {
      // if decoding fails, continue with raw strings
      console.warn('decodeURIComponent failed (maybe already decoded) — proceeding with raw paths');
    }

    // If the path is relative (no scheme), make sure it resolves from current location.
    // If the path looks like "aug/modules/tilear.glb" we will keep it as-is (relative)
    const tryFixPath = (p) => {
      if (!p) return p;
      // if it looks like an absolute URL already, return
      if (p.startsWith('http://') || p.startsWith('https://') || p.startsWith('/')) return p;
      // otherwise treat as relative to current folder:
      return p;
    };
    glbPath = tryFixPath(glbPath);
    usdzPath = tryFixPath(usdzPath);

    const isIOS = ['iPad', 'iPhone', 'iPod'].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);

    if (isIOS) {
      document.getElementById('ios-fallback-container').style.display = 'flex';
      document.getElementById('ios-link').setAttribute('href', usdzPath);
      // show thumbnail if we can guess one
      document.getElementById('ios-thumbnail').src = 'images/tiles1.jpg';
    } else {
      // Android / WebXR path
      document.getElementById('android-ar-container').style.display = 'block';
      const sceneEl = document.getElementById('ar-scene');
      const tileGridContainer = document.getElementById('tile-grid-container');
      const instructionsEl = document.getElementById('instructions');

      // Wait until scene is loaded (renderer and WebXR subsystems are ready)
      if (sceneEl.hasLoaded) {
        initAR();
      } else {
        sceneEl.addEventListener('loaded', initAR);
      }

      function initAR() {
        // set model on the tile-grid component (update() will run inside component)
        try {
          tileGridContainer.setAttribute('tile-grid', { modelSrc: glbPath, gridSize: 12, tileWidth: 0.3, tileHeight: 0.3 });
        } catch (err) {
          // fallback to string syntax if needed
          tileGridContainer.setAttribute('tile-grid', `modelSrc: ${glbPath}; gridSize: 12; tileWidth: 0.3; tileHeight: 0.3`);
        }

        // Add event listener for hit-test select — handle multiple possible event.detail shapes
        sceneEl.addEventListener('ar-hit-test-select', (event) => {
          // event.detail can vary across browsers/platforms. Try several fallbacks:
          let pos = null;

          // 1) some implementations provide explicit position
          if (event.detail && event.detail.position && typeof event.detail.position.x === 'number') {
            pos = event.detail.position;
          }

          // 2) some provide a hitMatrix array or DOMMatrix-like with elements
          else if (event.detail && event.detail.hitMatrix) {
            const m = event.detail.hitMatrix;
            if (Array.isArray(m) && m.length >= 16) {
              pos = { x: m[12], y: m[13], z: m[14] };
            } else if (m && m.elements && m.elements.length >= 16) {
              pos = { x: m.elements[12], y: m.elements[13], z: m.elements[14] };
            }
          }

          // 3) best-effort: if there's xrHitResult + a renderer + a frame, try to derive pose safely
          else if (event.detail && event.detail.xrHitResult && sceneEl.renderer && sceneEl.renderer.xr) {
            try {
              const renderer = sceneEl.renderer;
              // try to use frame/pose if provided (note: this may not be available on all platforms)
              const frame = event.detail.frame || null;
              const hit = event.detail.xrHitResult;
              if (frame && hit) {
                // use frame.getPose(hit, referenceSpace) if referenceSpace available
                // careful: not all frames/referenceSpaces are exposed the same way; guard everything
                const session = renderer.xr.getSession && renderer.xr.getSession();
                if (session && typeof session.requestReferenceSpace === 'function') {
                  // we cannot block here for requestReferenceSpace, so we skip this approach in many runtimes
                }
                // if the hit has an anchorPose or pose we might try to extract transform
                if (hit.getPose && typeof hit.getPose === 'function' && renderer.xr.getReferenceSpace) {
                  // try safe invocation
                  try {
                    const refSpace = renderer.xr.getReferenceSpace ? renderer.xr.getReferenceSpace() : null;
                    const pose = hit.getPose ? hit.getPose(refSpace) : null;
                    if (pose && pose.transform && pose.transform.position) {
                      const p = pose.transform.position;
                      pos = { x: p.x, y: p.y, z: p.z };
                    }
                  } catch (e) {
                    // ignore — fallback continues
                  }
                }
              }
            } catch (e) {
              console.warn('XR pose extraction fallback failed:', e);
            }
          }

          if (!pos) {
            console.warn('Could not determine hit position from AR hit-test event. event.detail:', event.detail);
            instructionsEl.textContent = 'Could not place tiles — try moving device slowly and tapping again.';
            return;
          }

          // place the tile grid at the hit position and make it visible
          tileGridContainer.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
          tileGridContainer.setAttribute('visible', 'true');
          instructionsEl.innerHTML = 'Tiles placed. Tap again to move the pattern.';
        });

        // Try to automatically enter XR mode (some browsers require a user gesture; guard with try/catch)
        try {
          // Must be called after scene loaded; browsers often require a user gesture to enter XR.
          // If this call fails silently, user can still tap the screen to trigger AR actions.
          sceneEl.enterVR && sceneEl.enterVR();
        } catch (e) {
          console.warn('enterVR failed (likely requires user gesture):', e);
        }
      } // end initAR
    } // end else
  });
  </script>
</body>
</html>
