<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Tile Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        #ui-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #111;
            color: white;
        }
        .message h2 { margin-top: 0; }
        .ui-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        #ar-instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            z-index: 10;
        }
        #tile-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(34, 211, 238, 0.95);
            color: #000;
            padding: 10px 18px;
            border-radius: 20px;
            z-index: 10;
            font-size: 15px;
            font-weight: 700;
        }
        #clear-tiles-btn {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(220, 38, 38, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="message">
            <h2 id="ui-title">Loading AR...</h2>
            <p id="ui-message">Please wait, starting the best available experience for your device.</p>
        </div>
    </div>

    <div id="ar-instructions" style="display: none;">Scanning for floor... Move phone slowly.</div>
    <div id="tile-counter" style="display: none;">Tiles: <span id="tile-count">0</span></div>
    <button id="clear-tiles-btn">🗑️ Clear All Tiles</button>

    <a-scene 
        id="ar-scene"
        style="display: none;"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true; colorManagement: true;">
        
        <a-assets>
            <img id="tile-texture" src="" crossorigin="anonymous">
        </a-assets>

        <a-camera gps-camera rotation-reader look-controls="enabled: false"></a-camera>
        
        <a-light type="ambient" color="#FFF" intensity="1"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.7" position="-1 2 1"></a-light>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const uiContainer = document.getElementById('ui-container');
            const uiTitle = document.getElementById('ui-title');
            const uiMessage = document.getElementById('ui-message');
            const sceneEl = document.getElementById('ar-scene');
            const arInstructions = document.getElementById('ar-instructions');
            const tileCounter = document.getElementById('tile-counter');
            const tileCountSpan = document.getElementById('tile-count');
            const clearTilesBtn = document.getElementById('clear-tiles-btn');

            const urlParams = new URLSearchParams(window.location.search);
            const glbPath = urlParams.get('model');
            const usdzPath = urlParams.get('iosmodel');
            const tileImage = urlParams.get('image') || 'images/tiles1.jpg';
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            let tilesPlaced = 0;
            let placedTiles = [];

            console.log('Device:', isIOS ? 'iOS' : 'Android');
            console.log('Image path:', tileImage);

            if (isIOS && usdzPath) {
                // ==================== iOS ONLY - KEEP ORIGINAL ====================
                uiTitle.innerText = "iOS AR Ready";
                uiMessage.innerText = "Single tile preview using Quick Look.";
                
                const launchBtn = document.createElement('button');
                launchBtn.innerText = "🚀 View in AR";
                launchBtn.classList.add('ui-button');
                launchBtn.onclick = () => {
                    const anchor = document.createElement('a');
                    anchor.setAttribute('rel', 'ar');
                    anchor.setAttribute('href', usdzPath);
                    anchor.appendChild(document.createElement('img'));
                    document.body.appendChild(anchor);
                    anchor.click();
                    setTimeout(() => document.body.removeChild(anchor), 100);
                };
                uiMessage.parentElement.appendChild(launchBtn);
            } else {
                // ==================== ANDROID AR.js - FIXED VERSION ====================
                setupAndroidAR();
            }

            async function setupAndroidAR() {
                console.log('Setting up Android AR...');
                
                // Check camera permission
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment' } 
                    });
                    stream.getTracks().forEach(track => track.stop());
                    console.log('Camera permission OK');
                } catch (error) {
                    console.error('Camera error:', error);
                    uiTitle.innerText = "Camera Access Required";
                    uiMessage.innerText = "Please enable camera permissions and refresh.";
                    return;
                }

                uiTitle.innerText = "Android Multi-Tile AR Ready";
                uiMessage.innerText = "Click Start to place multiple tiles in your space!";
                
                const enterArButton = document.createElement('button');
                enterArButton.innerText = "🚀 START AR";
                enterArButton.classList.add('ui-button');
                uiMessage.parentElement.appendChild(enterArButton);
                
                enterArButton.addEventListener('click', async () => {
                    console.log('Starting AR...');
                    
                    // Load tile image texture
                    const tileTexture = document.getElementById('tile-texture');
                    tileTexture.setAttribute('src', tileImage);
                    
                    // Hide UI
                    uiContainer.style.display = 'none';
                    
                    // Show AR scene
                    sceneEl.style.display = 'block';
                    arInstructions.style.display = 'block';
                    tileCounter.style.display = 'block';
                    
                    arInstructions.innerText = 'Point camera at floor. Tap screen to place tiles.';
                    
                    // Wait for scene to initialize
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    console.log('AR Scene ready');
                });
            }

            // Place tiles on screen tap (Android only)
            if (!isIOS) {
                window.addEventListener('click', (event) => {
                    // Don't place if clicking UI buttons
                    if (event.target.tagName === 'BUTTON') return;
                    if (uiContainer.style.display !== 'none') return;
                    
                    console.log('Placing tile...');
                    
                    const camera = sceneEl.querySelector('a-camera');
                    if (!camera) return;
                    
                    const cameraPos = camera.getAttribute('position');
                    const cameraRot = camera.getAttribute('rotation');
                    
                    // Calculate position 1.5 meters in front of camera
                    const distance = 1.5;
                    const radY = (cameraRot.y * Math.PI) / 180;
                    
                    const x = cameraPos.x + distance * Math.sin(radY);
                    const y = -0.4; // Floor level
                    const z = cameraPos.z + distance * Math.cos(radY);
                    
                    // Create tile plane with texture
                    const tile = document.createElement('a-plane');
                    tile.setAttribute('src', '#tile-texture');
                    tile.setAttribute('width', '0.6');
                    tile.setAttribute('height', '0.6');
                    tile.setAttribute('position', `${x} ${y} ${z}`);
                    tile.setAttribute('rotation', '-90 0 0'); // Flat on ground
                    tile.setAttribute('material', 'side: double');
                    
                    // Add to scene
                    sceneEl.appendChild(tile);
                    placedTiles.push(tile);
                    
                    tilesPlaced++;
                    tileCountSpan.textContent = tilesPlaced;
                    
                    if (tilesPlaced > 0) {
                        clearTilesBtn.style.display = 'block';
                    }
                    
                    arInstructions.innerText = `✅ Tile ${tilesPlaced} placed! Tap to add more.`;
                    
                    console.log('Tile placed at:', { x, y, z });
                });

                // Clear all tiles
                clearTilesBtn.addEventListener('click', () => {
                    console.log('Clearing tiles...');
                    
                    placedTiles.forEach(tile => {
                        if (tile && tile.parentNode) {
                            tile.parentNode.removeChild(tile);
                        }
                    });
                    
                    placedTiles = [];
                    tilesPlaced = 0;
                    tileCountSpan.textContent = '0';
                    clearTilesBtn.style.display = 'none';
                    arInstructions.innerText = '🗑️ Cleared! Tap screen to place new tiles.';
                });
            }
        });
    </script>
</body>
</html>
