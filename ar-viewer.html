<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Tile Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        .ar-container { display: none; }
        .ios-fallback {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100vh;
            background-color: #111;
            color: white;
            padding: 20px;
        }
        .ios-fallback img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            margin-bottom: 24px;
            object-fit: cover;
        }
        .ios-fallback a {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #007aff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 10;
            text-align: center;
        }
    </style>

    <script>
      AFRAME.registerComponent('tile-grid', {
        schema: {
          gridSize: {type: 'number', default: 15},
          tileWidth: {type: 'number', default: 0.3},
          tileHeight: {type: 'number', default: 0.3}
        },
        init: function () {
          const data = this.data;
          const el = this.el;
          const halfGridSize = data.gridSize / 2;
          for (let i = 0; i < data.gridSize; i++) {
            for (let j = 0; j < data.gridSize; j++) {
              const tile = document.createElement('a-entity');
              tile.setAttribute('gltf-model', '#tile-model-asset');
              const xPos = (i - halfGridSize) * data.tileWidth;
              const yPos = (j - halfGridSize) * data.tileHeight;
              tile.setAttribute('position', { x: xPos, y: yPos, z: 0 });
              el.appendChild(tile);
            }
          }
        }
      });
    </script>
</head>
<body>

    <div id="android-ar-container" class="ar-container">
        <div id="instructions">Scanning for a surface... Move your phone slowly.</div>
        <a-scene 
            id="ar-scene"
            webxr="requiredFeatures: hit-test, local-floor;"
            ar-hit-test="target: #tile-grid-container; type: feature-point;"
            renderer="colorManagement: true;">
          <a-assets>
            <a-asset-item id="tile-model-asset" src=""></a-asset-item>
          </a-assets>
          <a-camera position="0 1.2 0"></a-camera>
          <a-entity id="tile-grid-container" visible="false" tile-grid></a-entity>
        </a-scene>
    </div>

    <div id="ios-fallback-container" class="ios-fallback">
        <img id="ios-thumbnail" src="" alt="Tile Preview"/>
        <p style="margin-bottom: 24px;">Ready to see this tile in your room?</p>
        <a id="ios-link" rel="ar" href="#">View in Room</a>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const tileName = urlParams.get('tile'); // e.g., 'polished'

        if (!tileName) {
            document.body.innerHTML = '<h1>Error: No tile specified.</h1>';
            return;
        }
        
        // This is a placeholder. You should pass the real thumbnail from the previous page if needed.
        const thumbnailPath = `images/tiles1.jpg`; 
        const isIOS = ['iPad', 'iPhone', 'iPod'].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);

        if (isIOS) {
            // Setup for iOS
            document.getElementById('ios-fallback-container').style.display = 'flex';
            const usdzPath = `aug/modules/tilear.usdz`; // CORRECTED FOLDER PATH
            document.getElementById('ios-link').setAttribute('href', usdzPath);
            document.getElementById('ios-thumbnail').setAttribute('src', thumbnailPath);
        } else {
            // Setup for Android
            document.getElementById('android-ar-container').style.display = 'block';
            const glbPath = `aug/modules/tilear.glb`; // CORRECTED FOLDER PATH
            document.getElementById('tile-model-asset').setAttribute('src', glbPath);

            const sceneEl = document.getElementById('ar-scene');
            const tileGridContainer = document.getElementById('tile-grid-container');
            const instructionsEl = document.getElementById('instructions');

            sceneEl.addEventListener('ar-hit-test-select', (event) => {
              const position = event.detail.xrHitResult.getPose(sceneEl.xrSession.getReferenceSpace('local-floor')).transform.position;
              tileGridContainer.setAttribute('position', position);
              tileGridContainer.setAttribute('visible', 'true');
              instructionsEl.innerHTML = 'Tap again to move the pattern.';
            });
            
            sceneEl.enterVR();
        }
      });
    </script>
</body>
</html>
