<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Tile Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        #ui-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        .message h2 { margin-top: 0; font-size: 24px; }
        .message p { font-size: 16px; margin: 10px 0; }
        .ui-button {
            display: inline-block;
            margin: 10px 5px;
            padding: 14px 28px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        #ar-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            display: none;
        }
        #ar-instructions {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.85);
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 14px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            max-width: 85%;
        }
        #tile-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(34, 211, 238, 0.95);
            color: #000;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #place-tile-btn {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(34, 211, 238, 0.95);
            color: #000;
            padding: 16px 32px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: auto;
        }
        #clear-tiles-btn {
            position: absolute;
            top: 70px;
            right: 20px;
            background-color: rgba(239, 68, 68, 0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: auto;
            display: none;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="message">
            <h2 id="ui-title">🚀 AR Tile Viewer</h2>
            <p id="ui-message">Checking device compatibility...</p>
            <div id="ui-actions"></div>
        </div>
    </div>

    <div id="ar-overlay">
        <div id="ar-instructions">Point at floor and tap the button below</div>
        <div id="tile-counter">Tiles: <span id="tile-count">0</span></div>
        <button id="place-tile-btn">📍 PLACE TILE</button>
        <button id="clear-tiles-btn">🗑️ Clear</button>
    </div>

    <a-scene 
        id="ar-scene"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
        style="display: none;">
        
        <a-assets>
            <img id="tile-texture" crossorigin="anonymous">
        </a-assets>

        <a-camera gps-camera rotation-reader look-controls="enabled: false"></a-camera>
        
        <a-entity light="type: ambient; intensity: 1;"></a-entity>
        <a-entity light="type: directional; intensity: 0.5;" position="1 2 1"></a-entity>
    </a-scene>

    <script>
        console.log('=== AR Viewer Starting ===');
        
        const urlParams = new URLSearchParams(window.location.search);
        const usdzPath = urlParams.get('iosmodel');
        const tileImage = urlParams.get('image') || 'images/tiles1.jpg';
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        console.log('Device:', isIOS ? 'iOS' : 'Android');
        console.log('Tile image:', tileImage);
        
        const uiContainer = document.getElementById('ui-container');
        const uiTitle = document.getElementById('ui-title');
        const uiMessage = document.getElementById('ui-message');
        const uiActions = document.getElementById('ui-actions');
        const sceneEl = document.getElementById('ar-scene');
        const arOverlay = document.getElementById('ar-overlay');
        const arInstructions = document.getElementById('ar-instructions');
        const tileCountSpan = document.getElementById('tile-count');
        const placeTileBtn = document.getElementById('place-tile-btn');
        const clearTilesBtn = document.getElementById('clear-tiles-btn');
        
        let tilesPlaced = 0;
        let placedTiles = [];
        
        // ==================== iOS - UNCHANGED ====================
        if (isIOS && usdzPath) {
            console.log('iOS mode - Quick Look');
            uiTitle.textContent = '📱 iOS AR Ready';
            uiMessage.textContent = 'Single tile preview using Quick Look';
            
            const launchBtn = document.createElement('button');
            launchBtn.className = 'ui-button';
            launchBtn.textContent = '🚀 View in AR';
            launchBtn.onclick = () => {
                console.log('Launching Quick Look');
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.setAttribute('href', usdzPath);
                anchor.appendChild(document.createElement('img'));
                document.body.appendChild(anchor);
                anchor.click();
                setTimeout(() => document.body.removeChild(anchor), 100);
            };
            uiActions.appendChild(launchBtn);
        } 
        // ==================== Android - FIXED ====================
        else {
            console.log('Android mode - Multi-tile');
            setupAndroid();
        }
        
        async function setupAndroid() {
            try {
                // Check camera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                stream.getTracks().forEach(track => track.stop());
                console.log('✅ Camera permission OK');
                
                uiTitle.textContent = '✨ Multi-Tile AR';
                uiMessage.innerHTML = '<strong>Place unlimited tiles!</strong><br>Use the button to place tiles on the floor.';
                
                const startBtn = document.createElement('button');
                startBtn.className = 'ui-button';
                startBtn.textContent = '🚀 START AR';
                startBtn.onclick = startAR;
                uiActions.appendChild(startBtn);
                
            } catch (error) {
                console.error('❌ Camera error:', error);
                uiTitle.textContent = '❌ Camera Required';
                uiMessage.textContent = 'Please enable camera permissions and refresh.';
            }
        }
        
        function startAR() {
            console.log('=== Starting AR ===');
            
            // Load texture
            const texture = document.getElementById('tile-texture');
            texture.src = tileImage;
            console.log('Loading texture:', tileImage);
            
            texture.onload = () => console.log('✅ Texture loaded');
            texture.onerror = () => console.error('❌ Texture load failed');
            
            // Hide UI, show AR
            uiContainer.style.display = 'none';
            sceneEl.style.display = 'block';
            arOverlay.style.display = 'block';
            
            console.log('✅ AR Scene ready');
            arInstructions.textContent = '👇 Tap "PLACE TILE" button below';
        }
        
        // Place tile function
        placeTileBtn.addEventListener('click', () => {
            console.log('=== Placing Tile ===');
            
            const camera = sceneEl.querySelector('a-camera');
            if (!camera) {
                console.error('❌ Camera not found');
                return;
            }
            
            const pos = camera.getAttribute('position');
            const rot = camera.getAttribute('rotation');
            
            // Place tile VERY close and lower - easier to see
            const distance = 1.0; // Closer than before
            const radY = (rot.y * Math.PI) / 180;
            
            const x = pos.x + distance * Math.sin(radY);
            const y = pos.y - 0.8; // Lower, near ground
            const z = pos.z + distance * Math.cos(radY);
            
            console.log('Tile position:', { x, y, z });
            
            // Create CONTAINER for tile + border
            const container = document.createElement('a-entity');
            container.setAttribute('position', `${x} ${y} ${z}`);
            container.setAttribute('rotation', '-90 0 0');
            
            // Main tile plane - BIGGER
            const tile = document.createElement('a-plane');
            tile.setAttribute('width', '1.0'); // Bigger!
            tile.setAttribute('height', '1.0');
            tile.setAttribute('position', '0 0 0');
            
            // Use texture OR fallback color
            const texture = document.getElementById('tile-texture');
            if (texture.complete && texture.naturalHeight > 0) {
                tile.setAttribute('src', '#tile-texture');
                tile.setAttribute('material', 'side: double; shader: flat');
                console.log('✅ Using texture');
            } else {
                tile.setAttribute('color', '#D2691E'); // Bright brown
                tile.setAttribute('material', 'side: double; shader: flat');
                console.log('⚠️ Using fallback color');
            }
            
            // Add BRIGHT BORDER for visibility
            const border = document.createElement('a-ring');
            border.setAttribute('radius-inner', '0.48');
            border.setAttribute('radius-outer', '0.52');
            border.setAttribute('color', '#00FFFF'); // Bright cyan
            border.setAttribute('position', '0 0 0.01');
            border.setAttribute('material', 'side: double; shader: flat');
            
            container.appendChild(tile);
            container.appendChild(border);
            
            sceneEl.appendChild(container);
            placedTiles.push(container);
            
            tilesPlaced++;
            tileCountSpan.textContent = tilesPlaced;
            clearTilesBtn.style.display = 'block';
            
            arInstructions.textContent = `✅ Tile ${tilesPlaced} placed! Look around to see it!`;
            
            console.log('✅ Tile placed successfully');
        });
        
        // Clear tiles
        clearTilesBtn.addEventListener('click', () => {
            console.log('=== Clearing Tiles ===');
            
            placedTiles.forEach(tile => {
                if (tile && tile.parentNode) {
                    tile.parentNode.removeChild(tile);
                }
            });
            
            placedTiles = [];
            tilesPlaced = 0;
            tileCountSpan.textContent = '0';
            clearTilesBtn.style.display = 'none';
            
            arInstructions.textContent = '🗑️ Cleared! Place new tiles';
            console.log('✅ All tiles cleared');
        });
    </script>
</body>
</html>
