<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR Tile Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; font-family: sans-serif; background: #000; color: #fff; }
    .ar-container { display: none; height: 100vh; width: 100vw; position: relative; }
    .ios-fallback { display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; height: 100vh; background-color: #111; color: white; padding: 20px; }
    .ios-fallback img { width: 150px; height: 150px; border-radius: 8px; margin-bottom: 24px; object-fit: cover; }
    .ios-fallback a { padding: 12px 24px; font-size: 18px; background-color: #007aff; color: white; text-decoration: none; border-radius: 8px; }
    #instructions { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background-color: rgba(0,0,0,0.7); color: white; padding: 10px 16px; border-radius: 8px; z-index: 10; text-align: center; max-width: 90%; }
    #start-ar-btn { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 12; padding: 12px 20px; background: linear-gradient(90deg,#00c6ff,#0072ff); color: #fff; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
    #start-ar-btn.hidden { display: none; }
    #status-msg { position: absolute; top: 18px; right: 18px; z-index: 12; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; font-size: 13px; color: #fff; }
    a-scene { width: 100vw; height: 100vh; }
  </style>

  <script>
    /* tile-grid component (same robust logic) */
    AFRAME.registerComponent('tile-grid', {
      schema: {
        gridSize: { type: 'number', default: 15 },
        tileWidth: { type: 'number', default: 0.3 },
        tileHeight: { type: 'number', default: 0.3 },
        modelSrc: { type: 'string', default: '' }
      },
      update: function (oldData) {
        const data = this.data;
        const el = this.el;

        if (!data.modelSrc || data.modelSrc === oldData.modelSrc) return;

        // clear previous
        while (el.firstChild) el.removeChild(el.firstChild);

        const half = data.gridSize / 2;
        for (let i = 0; i < data.gridSize; i++) {
          for (let j = 0; j < data.gridSize; j++) {
            const tile = document.createElement('a-entity');
            tile.setAttribute('gltf-model', data.modelSrc);
            // place on X and Z, Y=0 so grid sits on the floor plane
            const x = (i - half) * data.tileWidth;
            const z = (j - half) * data.tileHeight;
            tile.setAttribute('position', { x: x, y: 0, z: z });
            el.appendChild(tile);
          }
        }
      }
    });
  </script>
</head>
<body>
  <!-- AR container (Android / WebXR) -->
  <div id="android-ar-container" class="ar-container">
    <button id="start-ar-btn">Start AR</button>
    <div id="status-msg" aria-live="polite" style="display:none"></div>
    <div id="instructions">Scanning for a surface... Move your phone slowly and tap to place the tiles.</div>

    <a-scene
      id="ar-scene"
      webxr="requiredFeatures: hit-test, local-floor;"
      ar-hit-test="target: #tile-grid-container; type: feature-point;"
      renderer="colorManagement: true;">
      <a-camera position="0 1.2 0"></a-camera>
      <a-entity id="tile-grid-container" visible="false"></a-entity>
    </a-scene>
  </div>

  <!-- iOS fallback (USDZ) -->
  <div id="ios-fallback-container" class="ios-fallback">
    <img id="ios-thumbnail" src="images/tiles1.jpg" alt="Tile Preview"/>
    <p style="margin-bottom: 24px;">Ready to see this tile in your room?</p>
    <a id="ios-link" rel="ar" href="#">View in Room</a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const rawGlbParam = urlParams.get('model');
      const rawUsdzParam = urlParams.get('iosmodel');

      if (!rawGlbParam || !rawUsdzParam) {
        document.body.innerHTML = '<h1 style="color:#fff; background:#000; padding:24px; text-align:center;">Error: model parameter missing</h1>';
        return;
      }

      // decode params (they were encoded upstream)
      let glbPath = rawGlbParam;
      let usdzPath = rawUsdzParam;
      try {
        glbPath = decodeURIComponent(rawGlbParam);
        usdzPath = decodeURIComponent(rawUsdzParam);
      } catch (e) {
        console.warn('decodeURIComponent failed — using raw params');
      }

      const tryFixPath = (p) => {
        if (!p) return p;
        if (p.startsWith('http://') || p.startsWith('https://') || p.startsWith('/')) return p;
        return p; // keep relative
      };
      glbPath = tryFixPath(glbPath);
      usdzPath = tryFixPath(usdzPath);

      const isIOS = ['iPad', 'iPhone', 'iPod'].includes(navigator.platform) || (navigator.userAgent.includes("Mac") && "ontouchend" in document);

      if (isIOS) {
        // Use iOS USDZ quick look
        document.getElementById('ios-fallback-container').style.display = 'flex';
        document.getElementById('ios-link').setAttribute('href', usdzPath);
        document.getElementById('ios-thumbnail').src = 'images/tiles1.jpg';
        return;
      }

      // Non-iOS: show AR UI
      const androidContainer = document.getElementById('android-ar-container');
      androidContainer.style.display = 'block';
      const sceneEl = document.getElementById('ar-scene');
      const tileGridContainer = document.getElementById('tile-grid-container');
      const instructionsEl = document.getElementById('instructions');
      const startBtn = document.getElementById('start-ar-btn');
      const statusMsg = document.getElementById('status-msg');

      // configure grid model (tile-grid component will build grid when modelSrc is set)
      try {
        tileGridContainer.setAttribute('tile-grid', { modelSrc: glbPath, gridSize: 12, tileWidth: 0.3, tileHeight: 0.3 });
      } catch (e) {
        // fallback to string syntax (some A-Frame versions prefer string)
        tileGridContainer.setAttribute('tile-grid', `modelSrc: ${glbPath}; gridSize: 12; tileWidth: 0.3; tileHeight: 0.3`);
      }

      // Run init after scene loaded
      const initAfterLoaded = () => {
        // Listen for actual AR placement events
        sceneEl.addEventListener('ar-hit-test-select', (event) => {
          // try multiple ways to extract a position from the event
          let pos = null;
          if (event.detail && event.detail.position && typeof event.detail.position.x === 'number') {
            pos = event.detail.position;
          } else if (event.detail && event.detail.hitMatrix) {
            const m = event.detail.hitMatrix;
            if (Array.isArray(m) && m.length >= 16) {
              pos = { x: m[12], y: m[13], z: m[14] };
            } else if (m && m.elements && m.elements.length >= 16) {
              pos = { x: m.elements[12], y: m.elements[13], z: m.elements[14] };
            }
          } else if (event.detail && event.detail.xrHitResult && sceneEl.renderer && sceneEl.renderer.xr) {
            // best-effort attempt to use getPose (guarded)
            try {
              const hit = event.detail.xrHitResult;
              if (hit.getPose && sceneEl.renderer.xr.getReferenceSpace) {
                const ref = sceneEl.renderer.xr.getReferenceSpace && sceneEl.renderer.xr.getReferenceSpace();
                if (ref) {
                  const pose = hit.getPose(ref);
                  if (pose && pose.transform && pose.transform.position) {
                    const p = pose.transform.position;
                    pos = { x: p.x, y: p.y, z: p.z };
                  }
                }
              }
            } catch (e) {
              console.warn('xrHitResult.getPose failed:', e);
            }
          }

          if (!pos) {
            console.warn('Could not extract hit position from event.detail:', event.detail);
            instructionsEl.textContent = 'Could not place tiles — try moving device slowly and tapping again.';
            return;
          }

          tileGridContainer.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
          tileGridContainer.setAttribute('visible', 'true');
          instructionsEl.innerHTML = 'Tiles placed. Tap again to move the pattern.';
        });

        // update UI when user enters or exits XR
        sceneEl.addEventListener('enter-vr', () => {
          statusMsg.style.display = 'block';
          statusMsg.textContent = 'AR session started';
          startBtn.classList.add('hidden');
        });
        sceneEl.addEventListener('exit-vr', () => {
          statusMsg.style.display = 'block';
          statusMsg.textContent = 'AR session ended';
          startBtn.classList.remove('hidden');
          setTimeout(() => (statusMsg.style.display = 'none'), 2000);
        });
      };

      if (sceneEl.hasLoaded) initAfterLoaded();
      else sceneEl.addEventListener('loaded', initAfterLoaded);

      // Start AR button — user gesture required
      startBtn.addEventListener('click', async () => {
        statusMsg.style.display = 'block';
        statusMsg.textContent = 'Requesting AR session — please allow any prompts...';

        // Try the simple A-Frame entry point (user gesture satisfied by click)
        try {
          // This usually triggers XR and is the simplest approach for A-Frame scenes
          await sceneEl.enterVR();
          // if enterVR resolves, A-Frame will fire enter-vr event
          return;
        } catch (err) {
          console.warn('sceneEl.enterVR() rejected:', err);
        }

        // Fallback: ask navigator.xr directly for an immersive-ar session (best-effort)
        try {
          if (navigator.xr && navigator.xr.isSessionSupported) {
            const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
            if (!supported) {
              statusMsg.textContent = 'AR not supported on this device/browser.';
              return;
            }
          }

          // request immersive-ar explicitly (some browsers prefer this API)
          if (navigator.xr && navigator.xr.requestSession) {
            const sessionInit = { requiredFeatures: ['hit-test', 'local-floor'] };
            const session = await navigator.xr.requestSession('immersive-ar', sessionInit);
            // set A-Frame's renderer to use this session if possible (A-Frame usually manages this itself)
            if (sceneEl.renderer && sceneEl.renderer.xr) {
              sceneEl.renderer.xr.setSession && sceneEl.renderer.xr.setSession(session);
            }
            statusMsg.textContent = 'AR session started (via navigator.xr).';
            startBtn.classList.add('hidden');
            return;
          } else {
            statusMsg.textContent = 'WebXR API not available in this browser.';
          }
        } catch (ex) {
          console.warn('navigator.xr.requestSession failed:', ex);
          statusMsg.textContent = 'Failed to start AR session. Make sure you are on a compatible mobile browser and on HTTPS, then tap Start AR again.';
        }
      });
    });
  </script>
</body>
</html>
