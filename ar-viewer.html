<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Tile Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        #ui-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #111;
            color: white;
        }
        .message h2 { margin-top: 0; }
        .ui-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        #ar-instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0,0,0,0.75);
            color: white;
            padding: 12px 22px;
            border-radius: 25px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="message">
            <h2 id="ui-title">Loading AR...</h2>
            <p id="ui-message">Please wait, starting the best available experience for your device.</p>
        </div>
    </div>

    <div id="ar-instructions" style="display: none;">Scanning for floor... Move phone slowly.</div>

    <a-scene 
        id="ar-scene"
        style="display: none;"
        webxr="requiredFeatures: hit-test; overlayElement: #ar-instructions;"
        ar-hit-test="target: #reticle;"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="tile-model-glb" src=""></a-asset-item>
        </a-assets>
        <a-camera></a-camera>
        <a-light type="ambient" color="#FFF" intensity="0.7"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.6" position="-1 2 1"></a-light>
        <a-entity id="reticle" geometry="primitive: ring; radiusInner: 0.08; radiusOuter: 0.1;" material="color: #00ffff; shader: flat;" rotation="-90 0 0" visible="false"></a-entity>
    </a-scene>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const uiContainer = document.getElementById('ui-container');
            const uiTitle = document.getElementById('ui-title');
            const uiMessage = document.getElementById('ui-message');
            const sceneEl = document.getElementById('ar-scene');
            const arInstructions = document.getElementById('ar-instructions');
            const reticle = document.getElementById('reticle');

            const urlParams = new URLSearchParams(window.location.search);
            const glbPath = urlParams.get('model');
            const usdzPath = urlParams.get('iosmodel');
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            let isWebXRSupported = false;
            if (navigator.xr) {
                try {
                    isWebXRSupported = await navigator.xr.isSessionSupported('immersive-ar');
                } catch (e) {
                    isWebXRSupported = false;
                }
            }
            
            // --- THIS IS THE NEW "GUARANTEED AR" LOGIC ---
            if (isWebXRSupported) {
                // --- PATH A: ADVANCED, MULTI-TILE EXPERIENCE ---
                setupWebXR();
            } else if (isIOS && usdzPath) {
                // --- PATH B: SIMPLE, NATIVE IOS EXPERIENCE (FALLBACK) ---
                // It will automatically redirect to the working single-tile viewer.
                const anchor = document.createElement('a');
                anchor.setAttribute('rel', 'ar');
                anchor.setAttribute('href', usdzPath);
                anchor.appendChild(document.createElement('img')); // Required for auto-activation
                anchor.click();
            } else {
                // --- PATH C: TRULY NOT SUPPORTED (e.g., old Android) ---
                uiTitle.innerText = "AR Not Supported";
                uiMessage.innerText = "Sorry, your device does not support this AR feature.";
                const backButton = document.createElement('a');
                backButton.innerText = "Go Back";
                backButton.href = "#";
                backButton.classList.add('ui-button');
                backButton.onclick = () => { window.history.back(); return false; };
                uiMessage.parentElement.appendChild(backButton);
            }

            function setupWebXR() {
                uiTitle.innerText = "AR Ready";
                uiMessage.innerText = "Click the button below to start placing multiple tiles.";
                
                const enterArButton = document.createElement('button');
                enterArButton.innerText = "🚀 ENTER AR";
                enterArButton.classList.add('ui-button');
                uiMessage.parentElement.appendChild(enterArButton);
                
                enterArButton.addEventListener('click', () => {
                    uiContainer.style.display = 'none';
                    sceneEl.style.display = 'block';
                    arInstructions.style.display = 'block';

                    document.getElementById('tile-model-glb').setAttribute('src', glbPath);

                    sceneEl.addEventListener('ar-hit-test-found', () => { reticle.setAttribute('visible', 'true'); arInstructions.innerText = 'Surface found! Tap to place a tile.'; });
                    sceneEl.addEventListener('ar-hit-test-lost', () => { reticle.setAttribute('visible', 'false'); });
                    
                    sceneEl.addEventListener('click', () => {
                        if (reticle.getAttribute('visible')) {
                            const newTile = document.createElement('a-gltf-model');
                            newTile.setAttribute('src', '#tile-model-glb');
                            const position = reticle.getAttribute('position');
                            newTile.setAttribute('position', position);
                            newTile.setAttribute('scale', '0.3 0.3 0.3');
                            sceneEl.appendChild(newTile);
                        }
                    });
                    sceneEl.enterVR();
                });
            }
        });
    </script>
</body>
</html>
