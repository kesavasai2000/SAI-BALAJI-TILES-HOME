<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Tile Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Poppins', sans-serif; }
        .ar-session-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }
        #instructions {
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .ui-buttons {
            display: flex;
            gap: 15px;
        }
        .ui-button {
            padding: 12px 24px;
            background: #fff;
            color: #333;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .ui-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="ar-session-ui">
        <div id="instructions">Point your phone at the floor and move it slowly...</div>
        <div class="ui-buttons">
            <button id="reset-button" class="ui-button">Clear Tiles</button>
            <button id="close-button" class="ui-button">Close AR</button>
        </div>
    </div>

    <a-scene 
        id="ar-scene"
        webxr="requiredFeatures: hit-test, dom-overlay; overlayElement: .ar-session-ui;"
        ar-hit-test="target: #reticle; enabled: true;"
        renderer="colorManagement: true;">
        
        <!-- Assets: Preload the tile model -->
        <a-assets>
            <a-asset-item id="tile-model" src=""></a-asset-item>
        </a-assets>

        <a-camera position="0 1.2 0"></a-camera>
        
        <!-- Lights for realistic rendering -->
        <a-light type="ambient" color="#FFF" intensity="0.7"></a-light>
        <a-light type="directional" color="#FFF" intensity="0.6" position="-1 2 1"></a-light>
        
        <!-- Reticle: A visual cursor on the floor to show where the tile will be placed -->
        <a-entity id="reticle"
            geometry="primitive: ring; radiusInner: 0.10; radiusOuter: 0.15;"
            material="color: #22d3ee; shader: flat; opacity: 0.8;"
            rotation="-90 0 0"
            visible="false">
        </a-entity>

        <!-- Parent entity to hold all the placed tiles -->
        <a-entity id="tiles-parent"></a-entity>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const sceneEl = document.getElementById('ar-scene');
        const instructionsEl = document.getElementById('instructions');
        const reticle = document.getElementById('reticle');
        const tilesParent = document.getElementById('tiles-parent');
        
        const urlParams = new URLSearchParams(window.location.search);
        const glbPath = urlParams.get('model');

        if (!glbPath) {
            instructionsEl.innerText = 'Error: Model not specified in URL.';
            return;
        }
        
        // Set the model path in the assets
        document.getElementById('tile-model').setAttribute('src', glbPath);

        let hasPlacedFirstTile = false;

        // --- AR Event Listeners ---

        // Fired when surface detection starts.
        sceneEl.addEventListener('ar-hit-test-start', () => {
            instructionsEl.innerText = 'Scanning for floor... Move your phone slowly.';
        });

        // Fired when a surface is found. Make the reticle visible.
        sceneEl.addEventListener('ar-hit-test-found', () => {
            reticle.setAttribute('visible', 'true');
            if (!hasPlacedFirstTile) {
                instructionsEl.innerText = 'Surface found! Tap the screen to place a tile.';
            }
        });

        // Fired when the surface is lost. Hide the reticle.
        sceneEl.addEventListener('ar-hit-test-lost', () => {
            reticle.setAttribute('visible', 'false');
            instructionsEl.innerText = 'Aim at the floor to continue.';
        });

        // Fired when the user taps the screen on a detected surface.
        sceneEl.addEventListener('ar-hit-test-select', () => {
            if (!reticle.getAttribute('visible')) return; // Don't place if no surface is found

            // 1. Create a new tile entity
            const newTile = document.createElement('a-gltf-model');
            newTile.setAttribute('src', '#tile-model');
            
            // 2. Get the reticle's current position and apply it to the new tile
            const position = reticle.getAttribute('position');
            newTile.setAttribute('position', position);
            
            // 3. Optional: Add a shadow for realism
            newTile.setAttribute('shadow', 'receive: false; cast: true');
            
            // 4. Add the tile to our scene
            tilesParent.appendChild(newTile);

            if (!hasPlacedFirstTile) {
                hasPlacedFirstTile = true;
                instructionsEl.innerText = 'Great! Tap to place another tile.';
            }
        });
        
        // --- UI Button Listeners ---
        
        document.getElementById('reset-button').addEventListener('click', () => {
            // Remove all child elements (tiles) from the parent
            while (tilesParent.firstChild) {
                tilesParent.removeChild(tilesParent.firstChild);
            }
            hasPlacedFirstTile = false;
            instructionsEl.innerText = 'Cleared! Tap the screen to place a new tile.';
        });

        document.getElementById('close-button').addEventListener('click', () => {
            // Attempts to gracefully exit the AR session
            if (sceneEl.xrSession) {
                sceneEl.xrSession.end();
            }
            // A simple way to go back to the previous page
            window.history.back();
        });
        
        // Automatically try to enter AR mode
        sceneEl.addEventListener('loaded', () => {
             sceneEl.enterVR();
        });
      });
    </script>
</body>
</html>
