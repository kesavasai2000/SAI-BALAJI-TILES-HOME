<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR Tile Viewer (WebXR + Fallback)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <!-- model-viewer fallback for Scene Viewer / Quick Look -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#000; color:#fff; }
    .container { position:relative; height:100vh; width:100vw; overflow:hidden; }
    #start-ar-btn { position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:50; padding:10px 16px; border-radius:8px; border:none; background:#0072ff; color:#fff; font-weight:600; cursor:pointer; }
    #status { position:absolute; top:16px; right:16px; background:rgba(0,0,0,0.6); padding:8px 10px; border-radius:8px; font-size:13px; }
    #instructions { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.6); padding:10px 14px; border-radius:8px; max-width:90%; text-align:center; }
    .hidden { display:none; }
    model-viewer { width:100%; height:100vh; background:#111; }
    a-scene { width:100%; height:100vh; }
  </style>
</head>
<body>
  <div class="container">
    <button id="start-ar-btn" class="hidden">Start AR</button>
    <div id="status">Checking device capabilities...</div>
    <div id="instructions">If AR is supported you'll see controls here.</div>

    <!-- WebXR AR scene (Android / WebXR-capable browsers) -->
    <div id="webxr-area" class="hidden">
      <a-scene id="ar-scene" webxr="requiredFeatures: ;" renderer="colorManagement: true;">
        <a-camera position="0 1.6 0"></a-camera>
        <a-entity id="tile-grid-container" visible="false"></a-entity>
      </a-scene>
    </div>

    <!-- model-viewer fallback (Scene Viewer on Android / Quick Look on iOS) -->
    <div id="fallback-area" class="hidden" style="display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <p style="margin:12px 0; color:#ddd">AR not supported via WebXR on this device — use the fallback button below to open a native viewer.</p>
      <model-viewer id="mv" src="" ios-src="" alt="Tile model" ar ar-modes="scene-viewer quick-look" camera-controls auto-rotate style="width:90%; max-width:600px; height:60vh;"></model-viewer>
      <a id="mv-link" style="margin-top:12px; background:#00a1ff; color:#fff; padding:10px 14px; border-radius:8px; text-decoration:none;">Open AR Viewer</a>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  let rawGlb = urlParams.get('model');
  let rawUsdz = urlParams.get('iosmodel');
  if (!rawGlb || !rawUsdz) {
    document.body.innerHTML = '<div style="padding:24px;color:#fff;background:#000">Error: model or iosmodel parameter missing</div>';
    return;
  }
  try { rawGlb = decodeURIComponent(rawGlb); rawUsdz = decodeURIComponent(rawUsdz); } catch (e) {}

  // Ensure we have paths (relative or absolute)
  const glbPath = rawGlb;
  const usdzPath = rawUsdz;

  const statusEl = document.getElementById('status');
  const instructionsEl = document.getElementById('instructions');
  const startBtn = document.getElementById('start-ar-btn');
  const webxrArea = document.getElementById('webxr-area');
  const fallbackArea = document.getElementById('fallback-area');
  const sceneEl = document.getElementById('ar-scene');
  const tileGridContainer = document.getElementById('tile-grid-container');

  // configure tile-grid component (simple grid builder)
  AFRAME.registerComponent('tile-grid', {
    schema: { modelSrc: {type: 'string', default:''}, gridSize: {type:'number', default:8}, tileWidth:{type:'number', default:0.3}, tileHeight:{type:'number', default:0.3} },
    update: function(oldData) {
      const d = this.data;
      const el = this.el;
      if (!d.modelSrc || d.modelSrc === oldData.modelSrc) return;
      while (el.firstChild) el.removeChild(el.firstChild);
      const half = d.gridSize/2;
      for (let i=0;i<d.gridSize;i++){
        for (let j=0;j<d.gridSize;j++){
          const tile = document.createElement('a-entity');
          tile.setAttribute('gltf-model', d.modelSrc);
          tile.setAttribute('position', {x:(i-half)*d.tileWidth, y:0, z:(j-half)*d.tileHeight});
          el.appendChild(tile);
        }
      }
    }
  });

  // set tile model for WebXR grid (component update will build when scene is ready)
  tileGridContainer.setAttribute('tile-grid', { modelSrc: glbPath, gridSize: 10, tileWidth: 0.32, tileHeight: 0.32 });

  // Detect WebXR immersive-ar support
  const supportsXR = !!(navigator.xr && navigator.xr.isSessionSupported);
  let immersiveArSupported = false;
  if (supportsXR) {
    try {
      immersiveArSupported = await navigator.xr.isSessionSupported('immersive-ar');
      console.log('isSessionSupported(immersive-ar):', immersiveArSupported);
    } catch (e) {
      console.warn('isSessionSupported error:', e);
    }
  } else {
    console.log('navigator.xr not available');
  }

  // Choose path
  if (immersiveArSupported) {
    statusEl.textContent = 'WebXR immersive-ar is supported on this device.';
    webxrArea.classList.remove('hidden');
    startBtn.classList.remove('hidden');
    instructionsEl.textContent = 'Tap Start AR to request an AR session (user gesture required).';
    // wire up Start button
    startBtn.addEventListener('click', async () => {
      statusEl.textContent = 'Requesting AR session...';
      // try to request a session. Use a forgiving session config (no strict requiredFeatures)
      try {
        await sceneEl.enterVR(); // A-Frame's enterVR -> requestSession
        console.log('sceneEl.enterVR resolved');
      } catch (err) {
        console.warn('sceneEl.enterVR rejected, trying navigator.xr.requestSession fallback:', err);
        // fallback to navigator.xr.requestSession with optionalFeatures
        try {
          const session = await navigator.xr.requestSession('immersive-ar', {
            optionalFeatures: ['local-floor', 'bounded-floor', 'dom-overlay', 'hit-test'],
            requiredFeatures: [] // don't demand hit-test as required; we try optional first
          });
          // let A-Frame know about the session if needed
          if (sceneEl.renderer && sceneEl.renderer.xr && sceneEl.renderer.xr.setSession) {
            sceneEl.renderer.xr.setSession(session);
          }
          statusEl.textContent = 'AR session started.';
          console.log('navigator.xr.requestSession started:', session);
        } catch (ex) {
          console.error('Could not create session because:', ex);
          statusEl.textContent = 'AR session failed: ' + (ex && ex.message ? ex.message : ex);
          instructionsEl.textContent = 'Try a different browser/device or use the fallback viewer below.';
        }
      }
    });

    // handle placement events if AR runtime gives hit-test events via A-Frame or custom.
    sceneEl.addEventListener('ar-hit-test-select', (ev) => {
      // attempt to extract a position:
      let pos = null;
      if (ev.detail && ev.detail.position) pos = ev.detail.position;
      else if (ev.detail && ev.detail.hitMatrix && Array.isArray(ev.detail.hitMatrix)) {
        const m = ev.detail.hitMatrix; pos = { x: m[12], y: m[13], z: m[14] };
      }
      if (!pos) {
        console.warn('No pos from event.detail', ev.detail);
        instructionsEl.textContent = 'Tap again to place the tiles.';
        return;
      }
      tileGridContainer.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
      tileGridContainer.setAttribute('visible', 'true');
      instructionsEl.textContent = 'Tiles placed. Tap again to move.';
    });

  } else {
    // Fallback: use model-viewer to open Scene Viewer (Android) or Quick Look (iOS)
    statusEl.textContent = 'WebXR immersive-ar not supported on this device/browser.';
    fallbackArea.classList.remove('hidden');
    const mv = document.getElementById('mv');
    mv.setAttribute('src', glbPath);
    mv.setAttribute('ios-src', usdzPath);
    const mvLink = document.getElementById('mv-link');
    // model-viewer will render its own AR button; but we also provide a direct link
    mvLink.setAttribute('href', glbPath);
    mvLink.textContent = 'Open AR Viewer (Scene Viewer / Quick Look)';
    instructionsEl.textContent = 'Use the button above to open the native AR viewer (if available).';
  }

});
</script>
</body>
</html>
