<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!--
        ✅ WHY WE REMOVED: <script src="supabase-js"></script>
        We no longer use Supabase for authentication.
        Our own server.js handles login/signup using PostgreSQL + JWT.
        Keeping Supabase here would mean two auth systems = confusion + bugs.
    -->

    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #000000;
        background-image: radial-gradient(circle at 50% 50%, #111111 0%, #000000 100%);
        min-height: 100vh; display: flex; align-items: flex-start;
        justify-content: center; padding: 20px; color: #fff; overflow-y: auto;
    }
    .stars-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; }
    .star { position: absolute; background-color: white; border-radius: 50%; animation: twinkle 4s infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

    .auth-container {
        background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        width: 100%; max-width: 440px; position: relative; z-index: 10; margin: auto;
    }
    .auth-header {
        background: rgba(255,255,255,0.05); padding: 28px 30px 22px;
        text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: relative;
    }
    .close-auth {
        position: absolute; top: 14px; right: 14px;
        background: rgba(255,255,255,0.1); border: none; color: #fff;
        width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 18px;
        display: flex; align-items: center; justify-content: center; transition: 0.3s;
    }
    .close-auth:hover { background: rgba(255,255,255,0.3); }
    .auth-header h2 { font-size: 22px; font-weight: 600; margin-bottom: 3px; }
    .auth-header p { font-size: 13px; opacity: 0.65; }
    .auth-body { padding: 22px 28px 28px; }

    .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-btn {
        flex: 1; padding: 9px; border: none; background: rgba(255,255,255,0.05);
        color: #888; font-size: 14px; font-weight: 600; border-radius: 8px;
        cursor: pointer; transition: 0.3s; font-family: 'Poppins', sans-serif;
    }
    .tab-btn.active { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.2); }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: #bbb; margin-bottom: 5px; }
    .form-input {
        width: 100%; padding: 11px 13px;
        background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px; font-size: 13.5px; color: #fff; transition: 0.3s;
        font-family: 'Poppins', sans-serif;
    }
    .form-input:focus { border-color: #22d3ee; outline: none; background: rgba(0,0,0,0.8); }
    .form-input::placeholder { color: #4a4a4a; }

    .form-row { display: flex; gap: 10px; }
    .form-row .form-group { flex: 1; min-width: 0; }

    .submit-btn {
        width: 100%; padding: 13px;
        background: linear-gradient(to right, #06b6d4, #3b82f6);
        color: #fff; border: none; border-radius: 8px;
        font-size: 15px; font-weight: 600; cursor: pointer;
        margin-top: 6px; transition: 0.2s; font-family: 'Poppins', sans-serif;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6,182,212,0.3); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .divider { text-align: center; margin: 16px 0; position: relative; }
    .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: rgba(255,255,255,0.08); }
    .divider span { background: #111; padding: 0 10px; position: relative; color: #555; font-size: 11px; }

    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .forgot-password { text-align: right; margin-bottom: 12px; }
    .forgot-password a { font-size: 12px; color: #aaa; text-decoration: none; cursor: pointer; }
    .forgot-password a:hover { color: #22d3ee; }

    .alert { padding: 11px 13px; border-radius: 6px; font-size: 12.5px; margin-bottom: 12px; display: none; line-height: 1.6; }
    .alert.show { display: block; }
    .alert-error { background: rgba(220,38,38,0.2); color: #fecaca; border: 1px solid rgba(220,38,38,0.4); }
    .alert-success { background: rgba(22,163,74,0.2); color: #bbf7d0; border: 1px solid rgba(22,163,74,0.4); }

    .section-label {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px;
        color: #444; margin: 16px 0 10px; padding-bottom: 6px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #main-header, header {
        background-color: transparent !important;
        background: transparent !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border-bottom: none !important;
        box-shadow: none !important;
    }
    body { background-position: top center !important; }
    </style>
</head>
<body>
    <div class="stars-container" id="stars-bg-global"></div>

    <div class="auth-container">
        <div class="auth-header">
            <button class="close-auth" onclick="goBack()">×</button>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your account</p>
        </div>

        <div class="auth-body">
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login', this)">Login</button>
                <button class="tab-btn" onclick="switchTab('signup', this)">Sign Up</button>
            </div>

            <div id="authAlert" class="alert"></div>

            <!-- LOGIN FORM -->
            <!--
                WHY onsubmit="handleLogin(event)"?
                When the user clicks "Sign In", the browser normally tries to
                reload the page (default form behavior). We intercept that with
                handleLogin(event) and call our own backend instead.
                event.preventDefault() inside the function stops the page reload.
            -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div class="forgot-password">
                    <a onclick="showForgotPassword()">Forgot Password?</a>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">

                <p class="section-label">Account Info</p>

                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" class="form-input" id="signupName" placeholder="Your Full Name" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" class="form-input" id="signupEmail" placeholder="your@email.com" required autocomplete="email">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" class="form-input" id="signupPassword" placeholder="Min. 6 chars" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <input type="password" class="form-input" id="signupConfirmPassword" placeholder="Re-enter" required autocomplete="new-password">
                    </div>
                </div>

                <p class="section-label">Contact Details (optional)</p>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-input" id="signupPhone" placeholder="+91 98765 43210" autocomplete="tel">
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" class="form-input" id="signupAddress" placeholder="House No, Street, City" autocomplete="street-address">
                </div>

                <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>
            </form>

        </div>
    </div>

    <script>

        // ============================================================
        // 🔧 CONFIGURATION
        // WHY: We define our backend URL in one place.
        // If your server port changes, you only change it here — not
        // scattered across 10 different fetch() calls.
        // In production, this becomes your real domain e.g. https://yourdomain.com
        // ============================================================
        const API_URL = 'http://localhost:5000';


        // ============================================================
        // ⭐ STARS BACKGROUND (visual only, unchanged)
        // ============================================================
        function createStars() {
            const c = document.getElementById('stars-bg-global');
            c.innerHTML = '';
            const n = Math.min(180, Math.floor(window.innerWidth / 8));
            for (let i = 0; i < n; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const sz = Math.random() * 2.5 + 0.5;
                s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${(Math.random()*3+3).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s;opacity:${(Math.random()*0.6+0.2).toFixed(2)};`;
                c.appendChild(s);
            }
        }
        createStars();
        window.addEventListener('resize', createStars);


        // ============================================================
        // 🔀 TAB SWITCHING (Login ↔ Signup, visual only, unchanged)
        // ============================================================
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.auth-title').textContent = 'Welcome Back';
                document.querySelector('.auth-subtitle').textContent = 'Sign in to access your account';
            } else {
                document.getElementById('signupForm').classList.add('active');
                document.querySelector('.auth-title').textContent = 'Create Account';
                document.querySelector('.auth-subtitle').textContent = 'Join Sai Balaji Tiles today';
            }
            hideAlert();
        }

        function switchTabToLogin() {
            document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === 0));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById('loginForm').classList.add('active');
            document.querySelector('.auth-title').textContent = 'Welcome Back';
            document.querySelector('.auth-subtitle').textContent = 'Sign in to access your account';
        }


        // ============================================================
        // 🔔 ALERT HELPERS (show/hide error or success messages)
        // ============================================================
        function goBack() { document.referrer ? window.history.back() : (window.location.href = 'index.html'); }
        function showAlert(msg, type) {
            const el = document.getElementById('authAlert');
            el.className = `alert alert-${type} show`;
            el.textContent = msg;
        }
        function hideAlert() { document.getElementById('authAlert').classList.remove('show'); }


        // ============================================================
        // 🔑 LOGIN FUNCTION
        //
        // WHAT HAPPENS STEP BY STEP:
        // 1. User clicks "Sign In"
        // 2. We grab the email & password from the input fields
        // 3. We send them to our server at POST /login using fetch()
        // 4. Server checks the database, compares bcrypt password
        // 5. If correct → server returns a JWT token + user info
        // 6. We save that token in localStorage (browser storage)
        // 7. We redirect the user based on their role
        //
        // WHY localStorage?
        // localStorage is a simple key-value store in the browser.
        // It persists even when you close the tab. So the user stays
        // logged in. We store the token there and send it with every
        // future API request to prove "I am logged in".
        // ============================================================
        async function handleLogin(e) {
            e.preventDefault(); // Stop browser from reloading the page

            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn      = document.getElementById('loginBtn');

            // Basic email format check before even hitting the server
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showAlert('❌ Please enter a valid email address', 'error');
                return;
            }

            // Disable button to prevent double-clicking while waiting for server
            btn.disabled = true;
            btn.textContent = 'Signing In...';

            try {
                // 📞 MAKE THE API CALL to our own server
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                        // WHY this header? We're sending JSON data.
                        // Without it, the server doesn't know the format
                        // and can't parse req.body properly.
                    },
                    body: JSON.stringify({ email, password })
                    // WHY JSON.stringify? fetch() can only send text.
                    // JSON.stringify converts { email, password } object
                    // into a text string: '{"email":"...","password":"..."}'
                });

                // Parse the JSON response from server
                const data = await response.json();

                if (!response.ok) {
                    // Server returned an error (400, 401, 500 etc.)
                    // We display the message our server sends back
                    throw new Error(data.message || 'Login failed');
                }

                // ✅ LOGIN SUCCESSFUL
                // data.token  → the JWT token
                // data.user   → { id, name, email, role }

                // Save token in localStorage
                // WHY? Every future protected API call needs this token.
                // We'll send it in the Authorization header like:
                // Authorization: Bearer <token>
                localStorage.setItem('token', data.token);

                // Save user info too (so other pages can show name, role etc.)
                localStorage.setItem('user', JSON.stringify(data.user));

                showAlert('✅ Login successful! Redirecting...', 'success');

                // Redirect based on role after short delay
                setTimeout(() => redirectByRole(data.user.role), 1000);

            } catch (err) {
                showAlert(`❌ ${err.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }


        // ============================================================
        // 📝 SIGNUP FUNCTION
        //
        // WHAT HAPPENS STEP BY STEP:
        // 1. User fills name, email, password, phone, address
        // 2. We validate (passwords match, email valid etc.)
        // 3. We send everything to POST /signup on our server
        // 4. Server hashes the password with bcrypt, saves to PostgreSQL
        // 5. Server returns the newly created user
        // 6. We auto-switch to login tab so user can sign in
        //
        // WHY don't we auto-login after signup?
        // Our /signup route doesn't return a token yet — it just
        // creates the account. We'll add auto-login in Phase 2
        // by also calling /login right after signup succeeds.
        // ============================================================
        async function handleSignup(e) {
            e.preventDefault();

            const name     = document.getElementById('signupName').value.trim();
            const email    = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm  = document.getElementById('signupConfirmPassword').value;
            const phone    = document.getElementById('signupPhone').value.trim();
            const address  = document.getElementById('signupAddress').value.trim();
            const btn      = document.getElementById('signupBtn');

            // --- CLIENT-SIDE VALIDATION ---
            // WHY validate here AND in the server?
            // Client-side: instant feedback, better UX, no server round-trip
            // Server-side: security (never trust the browser alone)
            // Both together = best practice
            if (!name) { showAlert('❌ Please enter your full name.', 'error'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('❌ Please enter a valid email.', 'error'); return; }
            if (password.length < 6) { showAlert('❌ Password must be at least 6 characters.', 'error'); return; }
            if (password !== confirm) { showAlert('❌ Passwords do not match.', 'error'); return; }

            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                // 📞 CALL POST /signup on our server
                const response = await fetch(`${API_URL}/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, phone, address })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Signup failed');
                }

                // ✅ ACCOUNT CREATED
                showAlert('🎉 Account created! Please sign in.', 'success');

                // Wait 1.5s then switch to login tab
                setTimeout(() => {
                    switchTabToLogin();
                    hideAlert();
                }, 1500);

            } catch (err) {
                let msg = err.message;
                // Make common error messages more user-friendly
                if (msg.includes('duplicate key') || msg.includes('already exists')) {
                    msg = '⚠️ This email is already registered. Please login instead.';
                    setTimeout(() => switchTabToLogin(), 2000);
                }
                showAlert(`❌ ${msg}`, 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }


        // ============================================================
        // 🔀 ROLE-BASED REDIRECT
        //
        // WHY do we need this?
        // Different users should land on different pages after login:
        //   admin   → admin dashboard (full control)
        //   worker  → worker dashboard (limited view)
        //   loader  → loader dashboard (delivery tasks)
        //   user    → main shop (index.html)
        //
        // The role is stored in YOUR PostgreSQL database (users table).
        // Your server returns it in data.user.role after login.
        // We use it here to decide where to send the user.
        //
        // ⚠️ NOTE: Right now your users table might not have a 'role'
        // column. We'll add that to the DB in Phase 3.
        // For now, everyone goes to index.html.
        // ============================================================
        function redirectByRole(role) {
            if (role === 'admin')        window.location.href = 'admin-dashboard.html';
            else if (role === 'worker')  window.location.href = 'worker-dashboard.html';
            else if (role === 'loader')  window.location.href = 'loader-dashboard.html';
            else                         window.location.href = 'index.html';
        }


        // ============================================================
        // 🔒 FORGOT PASSWORD
        //
        // NOTE: This requires a password reset email system.
        // That needs either: your own email server (nodemailer)
        // or a third-party service (SendGrid, Resend etc.)
        // We'll build this properly in Phase 4.
        // For now, it just shows an informational message.
        // ============================================================
        function showForgotPassword() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showAlert('📧 Please enter your email above first, then click Forgot Password.', 'error');
                return;
            }
            showAlert('📧 Password reset is coming soon. Please contact support for now.', 'error');
        }


        // ============================================================
        // 🔁 AUTO-REDIRECT IF ALREADY LOGGED IN
        //
        // WHY? If the user already logged in and their token is saved
        // in localStorage, there's no point showing the login page again.
        // We check if a valid token exists and redirect immediately.
        //
        // HOW we check: We call our protected /profile route.
        // If the token is valid → server returns 200 → redirect
        // If the token is expired or missing → server returns 401/403 → stay on page
        // ============================================================
        (async function autoRedirectIfLoggedIn() {
            const token = localStorage.getItem('token');
            if (!token) return; // No token saved, stay on login page

            try {
                const response = await fetch(`${API_URL}/profile`, {
                    headers: {
                        // WHY "Bearer"? It's a standard convention.
                        // "Bearer" means "the person carrying this token has permission"
                        // Server's authenticateToken middleware reads this exact format.
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    // Token is valid → user is already logged in
                    const user = JSON.parse(localStorage.getItem('user') || '{}');
                    redirectByRole(user.role);
                } else {
                    // Token expired or invalid → clear it and show login page fresh
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            } catch (err) {
                // Server unreachable — just stay on page silently
                console.warn('Auto-login check failed:', err.message);
            }
        })();

    </script>

</body>
</html>
