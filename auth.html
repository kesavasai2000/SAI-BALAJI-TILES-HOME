<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK (loaded ONCE only) -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    /* DARK UNIVERSE BACKGROUND */
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #000000;
        background-image: radial-gradient(circle at 50% 50%, #111111 0%, #000000 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
        color: #fff;
        overflow: hidden;
    }

    /* STARS */
    .stars-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; }
    .star { position: absolute; background-color: white; border-radius: 50%; opacity: 0.8; animation: twinkle 4s infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

    /* GLASS LOGIN BOX */
    .auth-container {
        background: rgba(20, 20, 20, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        width: 100%;
        max-width: 420px;
        position: relative;
        z-index: 10;
    }

    .auth-header {
        background: rgba(255, 255, 255, 0.05);
        padding: 35px 30px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
    }

    .close-auth {
        position: absolute; top: 15px; right: 15px;
        background: rgba(255, 255, 255, 0.1);
        border: none; color: #fff;
        width: 32px; height: 32px; border-radius: 50%;
        cursor: pointer; font-size: 20px;
        display: flex; align-items: center; justify-content: center;
        transition: 0.3s;
    }
    .close-auth:hover { background: rgba(255, 255, 255, 0.3); }

    .auth-header h2 { font-size: 26px; font-weight: 600; margin-bottom: 5px; }
    .auth-header p { font-size: 14px; opacity: 0.7; }

    .auth-body { padding: 30px; }

    /* TABS */
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 25px; }
    .tab-btn {
        flex: 1; padding: 10px; border: none;
        background: rgba(255, 255, 255, 0.05);
        color: #888;
        font-size: 14px; font-weight: 600;
        border-radius: 8px; cursor: pointer; transition: 0.3s;
        font-family: 'Poppins', sans-serif;
    }
    .tab-btn.active { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }

    /* INPUTS */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: #ccc; margin-bottom: 6px; }
    
    .form-input {
        width: 100%; padding: 12px 14px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        font-size: 14px; color: #fff;
        transition: 0.3s;
        font-family: 'Poppins', sans-serif;
    }
    .form-input:focus { border-color: #22d3ee; outline: none; background: rgba(0, 0, 0, 0.8); }
    .form-input::placeholder { color: #555; }

    /* BUTTONS */
    .submit-btn {
        width: 100%; padding: 14px;
        background: linear-gradient(to right, #06b6d4, #3b82f6);
        color: #fff; border: none; border-radius: 8px;
        font-size: 15px; font-weight: 600;
        cursor: pointer; margin-top: 5px; transition: 0.2s;
        font-family: 'Poppins', sans-serif;
    }
    .submit-btn:hover { transform: translateY(-2px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* GOOGLE BUTTON */
    .google-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        background-color: #ffffff;
        color: #333333;
        border: none;
        border-radius: 30px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        gap: 12px;
        margin-top: 15px;
        font-family: 'Poppins', sans-serif;
    }
    .google-btn:hover {
        background-color: #f2f2f2;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
    }
    .google-btn img { width: 20px; height: 20px; }

    .divider { text-align: center; margin: 20px 0; position: relative; }
    .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: rgba(255,255,255,0.1); }
    .divider span { background: #111; padding: 0 10px; position: relative; color: #666; font-size: 12px; }

    /* UTILS */
    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .forgot-password { text-align: right; margin-bottom: 15px; }
    .forgot-password a { font-size: 12px; color: #aaa; text-decoration: none; cursor: pointer; }
    .forgot-password a:hover { color: #22d3ee; }

    .alert { padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; line-height: 1.5; }
    .alert.show { display: block; }
    .alert-error { background: rgba(220, 38, 38, 0.2); color: #fecaca; border: 1px solid rgba(220, 38, 38, 0.5); }
    .alert-success { background: rgba(22, 163, 74, 0.2); color: #bbf7d0; border: 1px solid rgba(22, 163, 74, 0.5); }
    </style>
</head>
<body>

    <!-- Stars Background -->
    <div class="stars-container" id="stars-bg-global"></div>

    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <button class="close-auth" onclick="goBack()">×</button>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to access your account</p>
        </div>

        <div class="auth-body">
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login', this)">Login</button>
                <button class="tab-btn" onclick="switchTab('signup', this)">Sign Up</button>
            </div>

            <!-- Alert Box -->
            <div id="authAlert" class="alert"></div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <div class="forgot-password">
                    <a onclick="showForgotPassword()">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>

                <div class="divider"><span>OR</span></div>

                <button type="button" class="google-btn" onclick="googleSignIn()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
                    Sign in with Google
                </button>
            </form>

            <!-- ===== SIGNUP FORM ===== -->
            <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-input" id="signupName" placeholder="Your Full Name" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-input" id="signupEmail" placeholder="your@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-input" id="signupPassword" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" class="form-input" id="signupConfirmPassword" placeholder="Re-enter your password" required autocomplete="new-password">
                </div>

                <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // SUPABASE CONFIG
        // ==========================================
        const supabaseUrl = 'https://jjseffkbreruegudlmnd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impqc2VmZmticmVydWVndWRsbW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxOTMwMTEsImV4cCI6MjA4MTc2OTAxMX0.xrCWARm6FbW-U98Qs13mMvlCeBiQWgmD73qverF7Brk';

        const sbClient = supabase.createClient(supabaseUrl, supabaseKey);

        // ==========================================
        // STARS ANIMATION
        // ==========================================
        function createStars() {
            const container = document.getElementById('stars-bg-global');
            container.innerHTML = '';
            const count = Math.min(200, Math.floor(window.innerWidth / 8));
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 0.5;
                star.style.cssText = `
                    width:${size}px; height:${size}px;
                    left:${Math.random() * 100}%;
                    top:${Math.random() * 100}%;
                    animation-duration:${(Math.random() * 3 + 3).toFixed(1)}s;
                    animation-delay:${(Math.random() * 3).toFixed(1)}s;
                `;
                container.appendChild(star);
            }
        }
        createStars();
        window.addEventListener('resize', createStars);

        // ==========================================
        // UI HELPERS
        // ==========================================
        function switchTab(tab, clickedBtn) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            clickedBtn.classList.add('active');
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));

            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.auth-title').textContent = 'Welcome Back';
                document.querySelector('.auth-subtitle').textContent = 'Sign in to access your account';
            } else {
                document.getElementById('signupForm').classList.add('active');
                document.querySelector('.auth-title').textContent = 'Create Account';
                document.querySelector('.auth-subtitle').textContent = 'Join Sai Balaji Tiles today';
            }
            hideAlert();
        }

        // Switch to login tab programmatically (no click event needed)
        function switchTabToLogin() {
            const loginBtn = document.querySelector('.tab-btn:first-child');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            loginBtn.classList.add('active');
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById('loginForm').classList.add('active');
            document.querySelector('.auth-title').textContent = 'Welcome Back';
            document.querySelector('.auth-subtitle').textContent = 'Sign in to access your account';
        }

        function goBack() {
            if (document.referrer) window.history.back();
            else window.location.href = 'index.html';
        }

        function showAlert(message, type) {
            const alertEl = document.getElementById('authAlert');
            alertEl.className = `alert alert-${type} show`;
            alertEl.textContent = message;
        }

        function hideAlert() {
            document.getElementById('authAlert').classList.remove('show');
        }

        // ==========================================
        // LOGIN
        // ==========================================
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            // Email format check
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('❌ Please enter a valid email address (e.g. name@example.com)', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing In...';

            try {
                const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                showAlert('✅ Login successful! Redirecting...', 'success');
                await checkRoleAndRedirect(data.user.id);

            } catch (error) {
                let msg = error.message;
                if (msg.includes('Invalid login credentials') || msg.includes('invalid_credentials')) {
                    msg = '❌ Wrong email or password. Please check and try again.';
                } else if (msg.includes('Email not confirmed')) {
                    msg = '📧 Email not verified. Please contact support or disable email confirmation in Supabase.';
                } else if (msg.includes('Too many requests')) {
                    msg = '⏳ Too many attempts. Please wait a moment and try again.';
                }
                showAlert(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        // ==========================================
        // SIGNUP — Auto login after signup
        // NOTE: For instant login to work, you MUST go to:
        // Supabase Dashboard → Authentication → Providers → Email
        // and turn OFF "Confirm email"
        // ==========================================
        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const btn = document.getElementById('signupBtn');

            // Validations
            if (!name) {
                showAlert('❌ Please enter your full name.', 'error');
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('❌ Please enter a valid email address.', 'error');
                return;
            }
            if (password.length < 6) {
                showAlert('❌ Password must be at least 6 characters long.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showAlert('❌ Passwords do not match. Please re-enter.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating Account...';

            try {
                // Step 1: Create auth account
                const { data, error } = await sbClient.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: name } }
                });
                if (error) throw error;

                // Step 2: Save profile
                await sbClient.from('profiles').insert([{
                    id: data.user.id,
                    full_name: name,
                    role: 'user',
                    email: email
                }]);

                // Step 3: Auto sign-in (works when email confirmation is OFF)
                const { data: loginData, error: loginError } = await sbClient.auth.signInWithPassword({ email, password });

                if (loginError || !loginData.session) {
                    // Email confirmation is still ON in Supabase dashboard
                    showAlert('✅ Account created! Please go to Supabase Dashboard → Authentication → Providers → Email → Turn OFF "Confirm email". Then you can log in instantly.', 'success');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                    switchTabToLogin();
                    return;
                }

                // All good — redirect
                showAlert('🎉 Welcome to Sai Balaji Tiles!', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);

            } catch (error) {
                let msg = error.message;
                if (msg.includes('already registered') || msg.includes('User already registered')) {
                    msg = '⚠️ This email is already registered. Please login instead.';
                    setTimeout(() => switchTabToLogin(), 2000);
                }
                showAlert(msg, 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }

        // ==========================================
        // GOOGLE SIGN IN
        // ==========================================
        async function googleSignIn() {
            const { error } = await sbClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/index.html' }
            });
            if (error) showAlert(error.message, 'error');
        }

        // ==========================================
        // ROLE-BASED REDIRECT AFTER LOGIN
        // ==========================================
        async function checkRoleAndRedirect(userId) {
            const { data } = await sbClient
                .from('profiles')
                .select('role')
                .eq('id', userId)
                .single();

            // New Google user — no profile yet
            if (!data) {
                await createGoogleProfile();
                return;
            }

            const role = data.role;
            setTimeout(() => {
                if (role === 'admin')       window.location.href = 'admin-dashboard.html';
                else if (role === 'worker') window.location.href = 'worker-dashboard.html';
                else if (role === 'loader') window.location.href = 'loader-dashboard.html';
                else                        window.location.href = 'index.html'; // Regular customers
            }, 1000);
        }

        // ==========================================
        // CREATE PROFILE FOR NEW GOOGLE USERS
        // ==========================================
        async function createGoogleProfile() {
            const { data: { user } } = await sbClient.auth.getUser();
            if (user) {
                await sbClient.from('profiles').insert([{
                    id: user.id,
                    full_name: user.user_metadata.full_name || 'Customer',
                    role: 'user',
                    email: user.email
                }]);
                window.location.href = 'index.html';
            }
        }

        // ==========================================
        // FORGOT PASSWORD
        // ==========================================
        async function showForgotPassword() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showAlert('📧 Please type your email address in the field above, then click Forgot Password.', 'error');
                return;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('❌ Please enter a valid email address.', 'error');
                return;
            }
            const { error } = await sbClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/auth.html'
            });
            if (error) showAlert(error.message, 'error');
            else showAlert('✅ Password reset email sent! Please check your inbox.', 'success');
        }

        // ==========================================
        // AUTO-REDIRECT IF ALREADY LOGGED IN
        // ==========================================
        (async function checkSession() {
            const { data } = await sbClient.auth.getSession();
            if (data.session) {
                checkRoleAndRedirect(data.session.user.id);
            }
        })();
    </script>

</body>
</html>
