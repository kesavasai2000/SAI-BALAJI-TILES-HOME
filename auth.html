<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .auth-modal.hidden {
            display: none;
        }

        .auth-container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            position: relative;
            transform: scale(0.9);
            animation: scaleIn 0.3s ease forwards;
        }

        @keyframes scaleIn {
            to { transform: scale(1); }
        }

        .auth-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 30px;
            text-align: center;
            color: #fff;
            position: relative;
        }

        .close-auth {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-auth:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        .auth-header h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .auth-body {
            padding: 40px 30px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            color: #666;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 18px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: #fff;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 13px;
        }

        .social-login {
            display: grid;
            gap: 12px;
        }

        .social-btn {
            padding: 14px;
            border: 2px solid #e0e0e0;
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .social-btn img {
            width: 20px;
            height: 20px;
        }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #666;
        }

        .form-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-container {
                max-width: 100%;
            }
            .auth-header {
                padding: 30px 20px;
            }
            .auth-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div id="authModal" class="auth-modal">
        <div class="auth-container">
            <div class="auth-header">
                <button class="close-auth" onclick="goBack()">×</button>
                <h2>Welcome Back!</h2>
                <p>Sign in to access your account</p>
            </div>

            <div class="auth-body">
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                    <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
                </div>

                <div id="authAlert" class="alert"></div>

                <!-- LOGIN FORM -->
                <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-toggle">
                            <input type="password" class="form-input" id="loginPassword" placeholder="Enter password" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('loginPassword')">👁️</button>
                        </div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn" id="loginBtn">
                        Sign In
                    </button>

                    <div class="divider"><span>OR</span></div>

                    <div class="social-login">
                        <button type="button" class="social-btn" onclick="alert('Google login requires extra setup. Please use Email/Password for now.')">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%234285F4' d='M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z'/%3E%3Cpath fill='%2334A853' d='M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z'/%3E%3Cpath fill='%23FBBC05' d='M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z'/%3E%3Cpath fill='%23EA4335' d='M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z'/%3E%3C/svg%3E" alt="Google">
                            Continue with Google
                        </button>
                    </div>
                </form>

                <!-- SIGNUP FORM -->
                <form id="signupForm" class="auth-form" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-input" id="signupName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-input" id="signupEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-toggle">
                            <input type="password" class="form-input" id="signupPassword" placeholder="Min. 6 characters" required minlength="6">
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('signupPassword')">👁️</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <div class="password-toggle">
                            <input type="password" class="form-input" id="signupConfirmPassword" placeholder="Confirm password" required>
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('signupConfirmPassword')">👁️</button>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn" id="signupBtn">
                        Create Account
                    </button>

                    <div class="divider"><span>OR</span></div>

                    <div class="form-footer">
                        By signing up, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Supabase SDK (Make sure this is only here once in the file) -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <script>
 
        const supabaseUrl = 'https://jjseffkbreruegudlmnd.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impqc2VmZmticmVydWVndWRsbW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxOTMwMTEsImV4cCI6MjA4MTc2OTAxMX0.xrCWARm6FbW-U98Qs13mMvlCeBiQWgmD73qverF7Brk';
        
     
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

     
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.auth-header h2').textContent = 'Welcome Back!';
                document.querySelector('.auth-header p').textContent = 'Sign in to access your account';
            } else {
                document.getElementById('signupForm').classList.add('active');
                document.querySelector('.auth-header h2').textContent = 'Create Account';
                document.querySelector('.auth-header p').textContent = 'Join us to start shopping';
            }
            hideAlert();
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function goBack() {
            window.history.back();
        }

        function showAlert(message, type) {
            const alert = document.getElementById('authAlert');
            if(alert) {
                alert.className = `alert alert-${type} show`;
                alert.textContent = message;
            } else {
                console.log(type + ": " + message);
            }
        }

        function hideAlert() {
            const alert = document.getElementById('authAlert');
            if(alert) alert.classList.remove('show');
        }

        // ============================================
        // 3. AUTHENTICATION LOGIC
        // ============================================

        // --- HANDLE LOGIN ---
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = 'Signing In<span class="spinner"></span>';

            try {
                // A. Login
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // B. Check Role
                await checkRoleAndRedirect(data.user.id);

            } catch (error) {
                console.error('Login error:', error);
                showAlert(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }

        // --- HANDLE SIGNUP ---
        async function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const btn = document.getElementById('signupBtn');

            if (password !== confirmPassword) {
                showAlert('❌ Passwords do not match!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Creating Account<span class="spinner"></span>';

            try {
                // A. Sign up
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // B. Insert Profile Row
                const { error: profileError } = await supabase
                    .from('profiles')
                    .insert([
                        { id: data.user.id, full_name: name, role: 'user', email: email }
                    ]);

                if (profileError) throw profileError;

                showAlert('✅ Account created! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'user-dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Signup error:', error);
                showAlert(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }

        // --- CHECK ROLE HELPER ---
        async function checkRoleAndRedirect(userId) {
            const { data, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', userId)
                .single();

            if (error) {
                console.warn('Profile not found, defaulting to user.');
                window.location.href = 'user-dashboard.html';
                return;
            }

            const role = data.role;
            showAlert(`✅ Verified. Logging in as ${role}...`, 'success');

            setTimeout(() => {
                if (role === 'admin') window.location.href = 'admin-dashboard.html';
                else if (role === 'worker') window.location.href = 'worker-dashboard.html';
                else if (role === 'loader') window.location.href = 'loader-dashboard.html';
                else window.location.href = 'user-dashboard.html';
            }, 1000);
        }

        // --- FORGOT PASSWORD ---
        async function showForgotPassword() {
            const email = document.getElementById('loginEmail').value;
            
            if (!email) {
                showAlert('Please enter your email first', 'error');
                return;
            }

            if (confirm(`Send password reset email to ${email}?`)) {
                const { error } = await supabase.auth.resetPasswordForEmail(email);
                if (error) {
                    showAlert(error.message, 'error');
                } else {
                    showAlert('✅ Reset email sent!', 'success');
                }
            }
        }

        // --- GOOGLE SIGN IN (Placeholder) ---
        function googleSignIn() {
             alert('To use Google Login with Supabase, you need to enable the Google Provider in Supabase Auth Settings. For now, please use Email/Password.');
        }

        // Check session on load
        (async function checkSession() {
            const { data } = await supabase.auth.getSession();
            if (data.session) {
                console.log("User already logged in.");
            }
        })();
    </script>

</body>
</html>
