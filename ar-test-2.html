<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Advanced Diagnostic</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 20px; font-size: 18px; line-height: 1.6; }
        .result { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; }
        .supported { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .not-supported { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; word-wrap: break-word; }
        .warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        code { background-color: #eee; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>WebAR Advanced Diagnostic</h1>
    
    <div class="result warning">
        <h2>⚠️ PLEASE CHECK THIS FIRST! ⚠️</h2>
        <p>This test will fail if you are in <strong>Private Browsing Mode</strong> or an <strong>In-App Browser</strong> (like from Gmail/Instagram). Please ensure you are using the normal, main Safari app.</p>
    </div>

    <h2>Browser Fingerprint</h2>
    <div id="user-agent" class="result info">
        Your User Agent is: <strong>Loading...</strong>
    </div>
    
    <hr>
    
    <h2>Capability Test</h2>
    <div id="results"></div>

    <script>
        async function runTest() {
            // Display User Agent
            const userAgentDiv = document.getElementById('user-agent');
            userAgentDiv.innerHTML = `Your User Agent is: <strong>${navigator.userAgent}</strong>`;

            const resultsDiv = document.getElementById('results');
            let output = '';

            // Test 1: Check for the WebXR API (navigator.xr)
            output += '<h3>Test: WebXR API</h3>';
            if (navigator.xr) {
                output += '<div class="result supported">WebXR API (<code>navigator.xr</code>) FOUND.</div>';
                
                try {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    if (supported) {
                        output += '<div class="result supported"><code>immersive-ar</code> sessions are SUPPORTED. Multi-tile mode should work!</div>';
                    } else {
                        output += '<div class="result not-supported"><code>immersive-ar</code> sessions are NOT SUPPORTED.</div>';
                        output += '<p><strong>Reason:</strong> The experimental flags in Safari settings are likely turned off.</p>';
                    }
                } catch (e) {
                    output += `<div class="result not-supported">An ERROR occurred checking for <code>immersive-ar</code> support: ${e.message}</div>`;
                }

            } else {
                output += '<div class="result not-supported">WebXR API (<code>navigator.xr</code>) NOT FOUND.</div>';
                output += '<p><strong>Reason:</strong> This confirms your browser environment is missing the core AR feature.</p>';
            }

            resultsDiv.innerHTML = output;
        }

        runTest();
    </script>
</body>
</html>
