<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #22d3ee; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #06b6d4; }
        .logout { background: #ff4d4d; color: white; margin-bottom: 20px; width: auto; padding: 8px 16px; float: right; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <button class="logout" onclick="logout()">Logout</button>
        <h1>👷 Sales Entry</h1>
        <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #eee;">

        <!-- STEP 1: Customer Details -->
        <div id="step1">
            <h3>Step 1: Customer Details</h3>
            <input type="text" id="custName" placeholder="Customer Name">
            <input type="tel" id="custPhone" placeholder="Phone Number">
            <input type="text" id="custAddr" placeholder="Delivery Address">
            <button onclick="goToStep2()">Next: Select Tiles</button>
        </div>

        <!-- STEP 2: Select Tiles -->
        <div id="step2" class="hidden">
            <h3>Step 2: Order Details</h3>
            <p><strong>Customer:</strong> <span id="displayCustName"></span></p>
            
            <label>Select Tile Model:</label>
            <!-- EMPTY SELECT: We will fill this using JavaScript -->
            <select id="tileSelect">
                <option value="">Loading products...</option>
            </select>
            
            <input type="number" id="tileQty" placeholder="Quantity (Boxes)">
            <input type="text" id="measurements" placeholder="Measurements / Notes (e.g. 1200 sq.ft hall)">
            
            <button onclick="submitOrder()">✅ Submit Order to Loader</button>
            <button onclick="location.reload()" style="background: #ccc; margin-top: 10px;">Cancel</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚀 PASTE YOUR KEYS HERE
        // ==========================================
        const supabaseUrl = 'https://jjseffkbreruegudlmnd.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impqc2VmZmticmVydWVndWRsbW5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYxOTMwMTEsImV4cCI6MjA4MTc2OTAxMX0.xrCWARm6FbW-U98Qs13mMvlCeBiQWgmD73qverF7Brk';

        const sbClient = supabase.createClient(supabaseUrl, supabaseKey);

        // --- AUTH CHECK ---
        async function checkAuth() {
            const { data: { session } } = await sbClient.auth.getSession();
            if (!session) window.location.href = 'auth.html';
        }
        checkAuth();

        // --- NEW FUNCTION: LOAD PRODUCTS FROM DATABASE ---
        async function loadProducts() {
            // 1. Fetch products from Supabase
            const { data: products, error } = await sbClient
                .from('products')
                .select('*');

            if (error) {
                console.error('Error loading products:', error);
                return;
            }

            // 2. Find the dropdown menu
            const select = document.getElementById('tileSelect');
            select.innerHTML = '<option value="">-- Select a Tile --</option>'; // Clear loading message

            // 3. Loop through products and create options
            products.forEach(product => {
                const option = document.createElement('option');
                // We save the Name as the value
                option.value = product.name; 
                // We show Name + Stock count to the worker
                option.textContent = `${product.brand} - ${product.name} (Stock: ${product.stock})`;
                select.appendChild(option);
            });
        }

        function goToStep2() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const addr = document.getElementById('custAddr').value;

            if(!name || !phone || !addr) return alert("Please fill all customer details.");
            
            document.getElementById('displayCustName').textContent = name;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');

            // LOAD PRODUCTS NOW
            loadProducts();
        }

        async function submitOrder() {
            const { data: { user } } = await sbClient.auth.getUser();
            const selectedTile = document.getElementById('tileSelect').value;

            if (!selectedTile) return alert("Please select a tile");

            const orderData = {
                customer_name: document.getElementById('custName').value,
                customer_phone: document.getElementById('custPhone').value,
                customer_address: document.getElementById('custAddr').value,
                items: [{
                    tile: selectedTile,
                    qty: document.getElementById('tileQty').value,
                    measurements: document.getElementById('measurements').value
                }],
                status: 'processing',
                worker_id: user.id
            };

            const { error } = await sbClient.from('orders').insert([orderData]);

            if (error) {
                alert("Error submitting: " + error.message);
            } else {
                alert("✅ Order Sent to Loader Successfully!");
                location.reload();
            }
        }

        async function logout() {
            await sbClient.auth.signOut();
            window.location.href = 'auth.html';
        }
    </script>
</body>
</html>
