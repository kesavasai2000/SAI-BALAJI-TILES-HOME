<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <style>
    * { box-sizing: border-box; }
    
    /* DARK UNIVERSE BACKGROUND */
    body { 
        font-family: 'Poppins', sans-serif; 
        background-color: #000000;
        background-image: radial-gradient(circle at 50% 50%, #111111 0%, #000000 100%);
        padding: 15px; margin: 0; min-height: 100vh;
        color: white;
    }

    /* STARS */
    .stars-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; }
    .star { position: absolute; background-color: white; border-radius: 50%; opacity: 0.8; animation: twinkle 6s infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

    /* GLASS CONTAINER */
    .container { 
        max-width: 600px; 
        margin: 0 auto; 
        background: rgba(20, 20, 20, 0.6); /* Glass Effect */
        backdrop-filter: blur(15px);
        padding: 25px; 
        border-radius: 12px; 
        box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 100%;
    }

    h1 { color: #fff; font-size: 24px; margin-top: 0; text-align: center; }
    
    input, select { 
        width: 100%; 
        padding: 14px; 
        margin-bottom: 15px; 
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.2); 
        border-radius: 8px; 
        color: white;
        font-size: 16px;
    }
    
    select option { background: #000; color: white; }

    button { 
        width: 100%; padding: 15px; 
        background: linear-gradient(to right, #22d3ee, #06b6d4);
        color: #000; font-weight: bold; 
        border: none; border-radius: 8px; 
        cursor: pointer; font-size: 16px; margin-bottom: 10px;
        transition: transform 0.2s;
    }
    button:active { transform: scale(0.98); }

    .logout { 
        background: transparent; border: 1px solid #ff4d4d;
        color: #ff4d4d; width: auto; padding: 8px 16px; font-size: 14px; float: right;
    }
    .logout:hover { background: #ff4d4d; color: white; }
    
    .hidden { display: none; }

    @media (max-width: 480px) {
        .container { padding: 20px; }
        h1 { font-size: 20px; }
    }
    /* FORCE HEADER TO BE PERMANENTLY TRANSPARENT ON ALL PAGES */
#main-header, header {
    background-color: transparent !important;
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
}

/* PREVENT HEADER.JS FROM PUSHING THE BACKGROUND DOWN */
body {
    background-position: top center !important;
}
</style>
    
    
</head>
<body>
    <!-- Background Stars Container -->
<div class="stars-container" id="stars-bg-global"></div>

    <div class="container">
        <button class="logout" onclick="logout()">Logout</button>
        <h1>👷 Sales Entry</h1>
        <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #eee;">

        <!-- STEP 1: Customer Details -->
        <div id="step1">
            <h3>Step 1: Customer Details</h3>
            <input type="text" id="custName" placeholder="Customer Name">
            <input type="tel" id="custPhone" placeholder="Phone Number">
            <input type="text" id="custAddr" placeholder="Delivery Address">
            <button onclick="goToStep2()">Next: Select Tiles</button>
        </div>

        <!-- STEP 2: Select Tiles -->
        <div id="step2" class="hidden">
            <h3>Step 2: Order Details</h3>
            <p><strong>Customer:</strong> <span id="displayCustName"></span></p>
            
            <label>Select Tile Model:</label>
            <!-- EMPTY SELECT: We will fill this using JavaScript -->
            <select id="tileSelect">
                <option value="">Loading products...</option>
            </select>
            
            <input type="number" id="tileQty" placeholder="Quantity (Boxes)">
            <input type="text" id="measurements" placeholder="Measurements / Notes (e.g. 1200 sq.ft hall)">
            
            <button onclick="submitOrder()">✅ Submit Order to Loader</button>
            <button onclick="location.reload()" style="background: #ccc; margin-top: 10px;">Cancel</button>
        </div>
    </div>

    <script>
        // ==========================================
        // BACKEND CONFIG
        // ==========================================
        const API_URL = 'http://localhost:5000';

        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        // --- AUTH CHECK ---
        // Worker dashboard: only allow users with role 'worker'
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token) { window.location.href = 'auth.html'; return; }
            if (user.role !== 'worker') {
                alert('Access denied. Workers only.');
                window.location.href = 'index.html';
            }
        }
        checkAuth();

        // --- LOAD PRODUCTS FROM OUR BACKEND ---
        // WHY GET /products?
        // The worker needs to pick a tile from a dropdown.
        // We fetch the product list from our own PostgreSQL via server.js.
        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products`, { headers: getAuthHeaders() });
                const products = await res.json();
                const select = document.getElementById('tileSelect');
                select.innerHTML = '<option value="">-- Select a Tile --</option>';
                if(Array.isArray(products)) {
                    products.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.name;
                        opt.textContent = `${p.brand} - ${p.name} (Stock: ${p.stock})`;
                        select.appendChild(opt);
                    });
                }
            } catch(e) { console.error('Products load failed:', e); }
        }

        function goToStep2() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const addr = document.getElementById('custAddr').value;

            if(!name || !phone || !addr) return alert("Please fill all customer details.");
            
            document.getElementById('displayCustName').textContent = name;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');

            // LOAD PRODUCTS NOW
            loadProducts();
        }

        async function submitOrder() {
            // WHY get user from localStorage?
            // The worker_id comes from the logged-in user's JWT (stored in localStorage).
            // We don't need to call the server just to get the user ID.
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const selectedTile = document.getElementById('tileSelect').value;
            if (!selectedTile) return alert("Please select a tile");

            const orderData = {
                customer_name: document.getElementById('custName').value,
                customer_phone: document.getElementById('custPhone').value,
                customer_address: document.getElementById('custAddr').value,
                items: [{
                    tile: selectedTile,
                    qty: document.getElementById('tileQty').value,
                    measurements: document.getElementById('measurements').value
                }],
                status: 'processing',
                worker_id: user.id
            };

            try {
                const res = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify(orderData)
                });
                const data = await res.json();
                if(!res.ok) throw new Error(data.message);
                alert("✅ Order Sent to Loader Successfully!");
                location.reload();
            } catch(e) { alert("Error submitting: " + e.message); }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'auth.html';
        }
    </script>
</body>
</html>
