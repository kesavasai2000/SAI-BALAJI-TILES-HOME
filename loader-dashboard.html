<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader Dashboard - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .order-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 5px solid #ffa502; }
        .btn-load { background: #10b981; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .btn-load:hover { background: #059669; }
        .logout { background: #ff4d4d; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📦 Dispatch / Loader</h1>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
    <p>Orders pending for loading:</p>
    
    <div id="orders-list">
        <p>Loading pending orders...</p>
    </div>

    <script>
        // ============================================
        // 1. CONFIGURATION
        // ============================================
        
        // 👇 PASTE YOUR KEYS HERE (Copy them from your file before deleting, or from Supabase)
        const supabaseUrl = 'YOUR_SUPABASE_URL_HERE'; 
        const supabaseKey = 'YOUR_SUPABASE_ANON_KEY_HERE';

        // Initialize Supabase Client
        // FIX: We renamed this variable to 'supabaseClient' to avoid the error!
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // ============================================
        // 2. UI FUNCTIONS (Tabs, Alerts, etc)
        // ============================================
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
                document.querySelector('.auth-header h2').textContent = 'Welcome Back!';
                document.querySelector('.auth-header p').textContent = 'Sign in to access your account';
            } else {
                document.getElementById('signupForm').classList.add('active');
                document.querySelector('.auth-header h2').textContent = 'Create Account';
                document.querySelector('.auth-header p').textContent = 'Join us to start shopping';
            }
            hideAlert();
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function goBack() {
            window.history.back();
        }

        function showAlert(message, type) {
            const alert = document.getElementById('authAlert');
            if(alert) {
                alert.className = `alert alert-${type} show`;
                alert.textContent = message;
            } else {
                console.log(type + ": " + message);
            }
        }

        function hideAlert() {
            const alert = document.getElementById('authAlert');
            if(alert) alert.classList.remove('show');
        }

        // ============================================
        // 3. AUTHENTICATION LOGIC
        // ============================================

        // --- HANDLE LOGIN ---
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = 'Signing In<span class="spinner"></span>';

            try {
                // UPDATE: Using supabaseClient instead of supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Check Role
                await checkRoleAndRedirect(data.user.id);

            } catch (error) {
                console.error('Login error:', error);
                showAlert(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Sign In';
            }
        }

        // --- HANDLE SIGNUP ---
        async function handleSignup(event) {
            event.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const btn = document.getElementById('signupBtn');

            if (password !== confirmPassword) {
                showAlert('❌ Passwords do not match!', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Creating Account<span class="spinner"></span>';

            try {
                // UPDATE: Using supabaseClient
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Insert Profile Row
                const { error: profileError } = await supabaseClient
                    .from('profiles')
                    .insert([
                        { id: data.user.id, full_name: name, role: 'user', email: email }
                    ]);

                if (profileError) throw profileError;

                showAlert('✅ Account created! Redirecting...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'user-dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Signup error:', error);
                showAlert(error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }

        // --- CHECK ROLE HELPER ---
        async function checkRoleAndRedirect(userId) {
            // UPDATE: Using supabaseClient
            const { data, error } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', userId)
                .single();

            if (error) {
                console.warn('Profile not found, defaulting to user.');
                window.location.href = 'user-dashboard.html';
                return;
            }

            const role = data.role;
            showAlert(`✅ Verified. Logging in as ${role}...`, 'success');

            setTimeout(() => {
                if (role === 'admin') window.location.href = 'admin-dashboard.html';
                else if (role === 'worker') window.location.href = 'worker-dashboard.html';
                else if (role === 'loader') window.location.href = 'loader-dashboard.html';
                else window.location.href = 'user-dashboard.html';
            }, 1000);
        }

        // --- FORGOT PASSWORD ---
        async function showForgotPassword() {
            const email = document.getElementById('loginEmail').value;
            
            if (!email) {
                showAlert('Please enter your email first', 'error');
                return;
            }

            if (confirm(`Send password reset email to ${email}?`)) {
                // UPDATE: Using supabaseClient
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
                if (error) {
                    showAlert(error.message, 'error');
                } else {
                    showAlert('✅ Reset email sent!', 'success');
                }
            }
        }

        // Check session on load
        (async function checkSession() {
            // UPDATE: Using supabaseClient
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                console.log("User already logged in.");
            }
        })();
    </script>
</body>
</html>
</body>
</html>
