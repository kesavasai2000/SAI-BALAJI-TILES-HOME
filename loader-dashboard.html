<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader Dashboard - Sai Balaji Tiles</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
        <style>
    * { box-sizing: border-box; }
    
    /* DARK UNIVERSE BACKGROUND */
    body { 
        font-family: 'Poppins', sans-serif; 
        background-color: #000000;
        background-image: radial-gradient(circle at 50% 50%, #111111 0%, #000000 100%);
        padding: 15px; margin: 0; min-height: 100vh;
        color: white;
    }

    /* STARS */
    .stars-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -1; }
    .star { position: absolute; background-color: white; border-radius: 50%; opacity: 0.8; animation: twinkle 6s infinite ease-in-out; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
    
    .header { 
        display: flex; justify-content: space-between; align-items: center; 
        margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }
    
    h1 { margin: 0; font-size: 22px; }

    /* GLASS ORDER CARD */
    .order-card { 
        background: rgba(20, 20, 20, 0.6); /* Glass Effect */
        backdrop-filter: blur(15px);
        padding: 20px; 
        margin-bottom: 15px; 
        border-radius: 10px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left: 5px solid #ffa502; 
    }

    .btn-load { 
        background: rgba(16, 185, 129, 0.1); 
        color: #10b981; 
        border: 1px solid #10b981; 
        padding: 12px 20px; 
        cursor: pointer; 
        border-radius: 5px; 
        font-weight: bold; 
        width: 100%; 
        font-size: 16px;
        transition: 0.3s;
    }
    .btn-load:hover { background: #10b981; color: white; }

    .logout { 
        background: transparent; 
        color: #ff4d4d; 
        padding: 8px 16px; 
        border: 1px solid #ff4d4d;
        border-radius: 5px; 
        cursor: pointer; 
    }
    /* FORCE HEADER TO BE PERMANENTLY TRANSPARENT ON ALL PAGES */
#main-header, header {
    background-color: transparent !important;
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    border-bottom: none !important;
    box-shadow: none !important;
}

/* PREVENT HEADER.JS FROM PUSHING THE BACKGROUND DOWN */
body {
    background-position: top center !important;
}
</style>
</head>
<body>
    <!-- Background Stars Container -->
<div class="stars-container" id="stars-bg-global"></div>

    <div class="header">
        <h1>📦 Dispatch / Loader</h1>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
    <p>Orders pending for loading:</p>
    
    <div id="orders-list">
        <p>Loading pending orders...</p>
    </div>

    <script>
        // ==========================================
        // BACKEND CONFIG
        // ==========================================
        const API_URL = 'http://localhost:5000';

        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
        }

        // Auth check — loader role only
        function checkAuth() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!token) { window.location.href = 'auth.html'; return; }
            if (user.role !== 'loader') {
                alert('Access denied. Loaders only.');
                window.location.href = 'index.html';
            }
        }
        checkAuth();

        // Load pending orders from our backend
        // WHY GET /orders?status=processing?
        // We only want orders that need dispatching.
        // The server filters by status in PostgreSQL — much faster than fetching all and filtering in browser.
        async function loadPendingOrders() {
            const list = document.getElementById('orders-list');
            list.innerHTML = '<p>Loading pending orders...</p>';
            try {
                const res = await fetch(`${API_URL}/orders?status=processing`, { headers: getAuthHeaders() });
                const orders = await res.json();
                list.innerHTML = '';
                if (!Array.isArray(orders) || orders.length === 0) {
                    list.innerHTML = '<p>No orders pending dispatch.</p>'; return;
                }
                orders.forEach(order => {
                    const item = Array.isArray(order.items) ? order.items[0] : {};
                    const div = document.createElement('div');
                    div.className = 'order-card';
                    div.innerHTML = `
                        <h3>👤 ${order.customer_name}</h3>
                        <p>📞 ${order.customer_phone}</p>
                        <p>📍 ${order.customer_address}</p>
                        <hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;">
                        <p><strong>Tile:</strong> ${item.tile || '-'}</p>
                        <p><strong>Quantity:</strong> ${item.qty || '-'} Boxes</p>
                        <p><strong>Notes:</strong> ${item.measurements || '-'}</p>
                        <br>
                        <button class="btn-load" onclick="markLoaded(${order.id})">✅ Mark Loaded & Shipped</button>
                    `;
                    list.appendChild(div);
                });
            } catch(e) { list.innerHTML = '<p>Error loading orders.</p>'; }
        }

        // Mark order as delivered via PATCH /orders/:id
        async function markLoaded(orderId) {
            if(confirm("Confirm: Is this order loaded on the vehicle?")) {
                try {
                    const res = await fetch(`${API_URL}/orders/${orderId}`, {
                        method: 'PATCH',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({ status: 'delivered' })
                    });
                    if(!res.ok) throw new Error('Update failed');
                    alert("Order Dispatched!");
                    loadPendingOrders();
                } catch(e) { alert("Error: " + e.message); }
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'auth.html';
        }

        loadPendingOrders();
    </script>
</body>
</html>
</body>
</html>
