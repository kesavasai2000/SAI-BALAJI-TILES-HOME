<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Tile Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #ar-button { 
        position: absolute; 
        bottom: 20px; 
        left: 50%; 
        transform: translateX(-50%); 
        padding: 12px 24px; 
        z-index: 10; 
        background-color:#007aff; 
        color:white; 
        border:none; 
        border-radius:8px; 
      }
      a-scene { display: none; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <button id="ar-button" class="hidden">Start AR</button>
    <a id="ios-link" rel="ar" href="#" class="hidden">
      <img id="ios-thumbnail" src="#" />
    </a>

    <a-scene 
        id="ar-scene"
        webxr="requiredFeatures: hit-test, local-floor;"
        ar-hit-test="target: #tile-floor; type: feature-point;"
        renderer="colorManagement: true;">
      
      <a-assets>
        <!-- Tile texture -->
        <img id="tile-texture" src="aug/modules/tile-thumbnail.png" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 1.2 0"></a-camera>
      
      <!-- Large floor plane with repeating texture -->
      <a-entity id="tile-floor" visible="false"
                geometry="primitive: plane; width: 5; height: 5"
                material="src: #tile-texture; repeat: 10 10; side: double"
                rotation="-90 0 0">
      </a-entity>
    </a-scene>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // --- DYNAMIC LOADING LOGIC ---
        const urlParams = new URLSearchParams(window.location.search);
        const tileName = urlParams.get('tile');

        if (tileName) {
          // Get references
          const iosLink = document.getElementById('ios-link');
          const iosThumbnail = document.getElementById('ios-thumbnail');
          
          // Construct paths dynamically (example, adjust as needed)
          const usdzPath = `aug/modules/tilear.usdz`;
          const thumbnailPath = `aug/modules/tile-thumbnail.png`;

          // Set the dynamic paths
          iosLink.setAttribute('href', usdzPath);
          iosThumbnail.setAttribute('src', thumbnailPath);

          // Show AR button
          document.getElementById('ar-button').classList.remove('hidden');
        } else {
          document.body.innerHTML = '<h1>Error: No tile specified.</h1>';
        }

        // --- AR LAUNCH LOGIC ---
        const arButton = document.getElementById('ar-button');
        const sceneEl = document.getElementById('ar-scene');

        function isIOS() { 
          return ['iPad', 'iPhone', 'iPod'].includes(navigator.platform) || 
                 (navigator.userAgent.includes("Mac") && "ontouchend" in document); 
        }

        arButton.addEventListener('click', () => {
          if (isIOS()) {
            document.getElementById('ios-link').click();
          } else {
            arButton.style.display = 'none';
            sceneEl.style.display = 'block';
            sceneEl.enterVR();
          }
        });

        // --- AR PLACEMENT LOGIC ---
        const tileFloor = document.getElementById('tile-floor');
        sceneEl.addEventListener('ar-hit-test-select', (event) => {
          const position = event.detail.xrHitResult.getPose(sceneEl.xrSession.getReferenceSpace('local-floor')).transform.position;
          tileFloor.setAttribute('position', { x: position.x, y: position.y, z: position.z });
          tileFloor.setAttribute('visible', 'true');
        });
      });
    </script>
  </body>
</html>
